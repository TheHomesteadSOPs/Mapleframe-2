<div id="topbar"><h1>GEMHOLLOW</h1><div id="tools"><button id="hint" data-i18n-title="Hint (T)" title="Hint (T)" aria-label="Hint (T)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></button><button id="menu" data-i18n-title="Menu (Esc)" title="Menu (Esc)" aria-label="Menu"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><button id="mute" data-i18n-title="Sound on/off" title="Sound on/off" aria-label="Sound"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="slash" d="M3 3l18 18" stroke="#ff6b6b"/></svg></button><button id="fs" data-i18n-title="Fullscreen" title="Fullscreen" aria-label="Fullscreen"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div></div>

// ---------- CrazyGames SDK wrapper (safe when SDK is absent) ----------
const CG = {
  ready:false, playing:false, adActive:false,
  sdk(){ return window.CrazyGames&&window.CrazyGames.SDK; },
  async init(){ try{ const k=this.sdk(); if(!k) return; await k.init(); this.ready=true; try{ k.game.loadingStart(); }catch(e){} if(this.playing){ try{ k.game.gameplayStart(); }catch(e){} } }catch(e){} },
  loaded(){ try{ if(this.ready) this.sdk().game.loadingStop(); }catch(e){} },
  dataGet(k){ try{ return this.ready?this.sdk().data.getItem(k):null; }catch(e){ return null; } },
  dataSet(k,v){ try{ if(this.ready) this.sdk().data.setItem(k,v); }catch(e){} },
  start(){ if(this.playing) return; this.playing=true; try{ if(this.ready) this.sdk().game.gameplayStart(); }catch(e){} },
  stop(){ if(!this.playing) return; this.playing=false; try{ if(this.ready) this.sdk().game.gameplayStop(); }catch(e){} },
  happy(){ try{ if(this.ready) this.sdk().game.happytime(); }catch(e){} },
  ad(done){
    let called=false; const fin=()=>{ if(called) return; called=true; this.adActive=false; Snd.force(false); done(); };
    if(!this.ready) return fin();
    this.adActive=true;
    try{ this.sdk().ad.requestAd("midgame",{ adStarted:()=>Snd.force(true), adFinished:fin, adError:fin }); setTimeout(fin,60000); }catch(e){ fin(); }
  },
  rewarded(ok,fail){   // opt-in ad: the reward is only granted if the ad finishes; errors / no fill call fail
    let done=false; const end=g=>{ if(done) return; done=true; this.adActive=false; Snd.force(false); if(g) ok(); else if(fail) fail(); };
    if(!this.ready) return end(false);
    this.adActive=true;
    try{ this.sdk().ad.requestAd("rewarded",{ adStarted:()=>Snd.force(true), adFinished:()=>end(true), adError:()=>end(false) }); setTimeout(()=>end(false),120000); }catch(e){ end(false); }
  }
};

 ["Swap two neighboring gems to line up 3 or more of the same kind. Try it now!","Intercambia dos gemas vecinas para alinear 3 o más iguales. ¡Pruébalo ahora!","Troque duas gemas vizinhas para alinhar 3 ou mais iguais. Experimente agora!","Échangez deux gemmes voisines pour aligner 3 gemmes identiques ou plus. Essayez !","Tausche zwei benachbarte Steine, um 3 oder mehr gleiche in eine Reihe zu bringen. Probier es aus!","Поменяйте местами два соседних камня, чтобы собрать 3 и более одинаковых. Попробуйте!"],
 ["Skulls hurt your enemy. Bigger matches and cascades hit harder.","Las calaveras dañan al enemigo. Las combinaciones grandes y las cascadas pegan más fuerte.","Caveiras ferem o inimigo. Combinações maiores e cascatas causam mais dano.","Les crânes blessent l'ennemi. Les grosses combinaisons et les cascades frappent plus fort.","Totenköpfe verletzen deinen Gegner. Größere Kombinationen und Kaskaden treffen härter.","Черепа ранят врага. Большие комбинации и каскады бьют сильнее."],
 ["Fire, Air, Water and Earth gems fill your mana bars. Mana pays for spells.","Las gemas de Fuego, Aire, Agua y Tierra llenan tus barras de maná. El maná paga los hechizos.","Gemas de Fogo, Ar, Água e Terra enchem suas barras de mana. A mana paga os feitiços.","Les gemmes de Feu, d'Air, d'Eau et de Terre remplissent vos jauges de mana. Le mana paie les sorts.","Feuer-, Luft-, Wasser- und Erdsteine füllen deine Manaleisten. Mana bezahlt Zauber.","Камни Огня, Воздуха, Воды и Земли наполняют шкалы маны. Мана нужна для заклинаний."],
 ["A spell is ready! Tap a glowing spell button (or press its number). Casting doesn't end your turn.","¡Un hechizo está listo! Toca un botón brillante (o pulsa su número). Lanzarlo no termina tu turno.","Um feitiço está pronto! Toque em um botão brilhante (ou pressione seu número). Lançar não encerra seu turno.","Un sort est prêt ! Touchez un bouton lumineux (ou appuyez sur son numéro). Lancer un sort ne termine pas votre tour.","Ein Zauber ist bereit! Tippe auf eine leuchtende Taste (oder drücke ihre Nummer). Zaubern beendet deinen Zug nicht.","Заклинание готово! Нажмите светящуюся кнопку (или её номер). Заклинание не завершает ход."],
 ["Nice! Matching 4 or more gems in a line, or 5 in an L, T or + shape, earns an extra turn.","¡Bien! Combinar 4 o más gemas en línea, o 5 en forma de L, T o +, da un turno extra.","Legal! Combinar 4 ou mais gemas em linha, ou 5 em forma de L, T ou +, dá um turno extra.","Bien ! Aligner 4 gemmes ou plus, ou 5 en forme de L, T ou +, donne un tour supplémentaire.","Super! 4 oder mehr Steine in einer Reihe oder 5 in L-, T- oder +-Form bringen einen Extrazug.","Отлично! 4 и более камня в ряд или 5 в форме L, T или + дают дополнительный ход."],
 ["Now the enemy plays on the same board. Its skull matches hurt you, so keep an eye on your HP.","Ahora el enemigo juega en el mismo tablero. Sus calaveras te hieren, así que vigila tus PV.","Agora o inimigo joga no mesmo tabuleiro. As caveiras dele ferem você, então fique de olho nos seus PV.","L'ennemi joue maintenant sur le même plateau. Ses crânes vous blessent, surveillez vos PV.","Jetzt spielt der Gegner auf demselben Brett. Seine Totenköpfe verletzen dich – behalte deine LP im Blick.","Теперь враг ходит на том же поле. Его черепа ранят вас, следите за своими ОЗ."],
 ["Stuck? Tap the lightbulb for a hint.","¿Atascado? Toca la bombilla para ver una pista.","Travado? Toque na lâmpada para uma dica.","Bloqué ? Touchez l'ampoule pour un indice.","Nicht weiter? Tippe auf die Glühbirne für einen Tipp.","Не знаете, что делать? Нажмите на лампочку для подсказки."],

 ["Swap two neighboring gems to line up <b>3 or more</b>. Then the enemy takes its turn on the same board.","Intercambia dos gemas vecinas para alinear <b>3 o más</b>. Luego el enemigo juega su turno en el mismo tablero.","Troque duas gemas vizinhas para alinhar <b>3 ou mais</b>. Depois o inimigo joga no mesmo tabuleiro.","Échangez deux gemmes voisines pour aligner <b>3 ou plus</b>. L'ennemi joue ensuite sur le même plateau.","Tausche zwei benachbarte Steine, um <b>3 oder mehr</b> in eine Reihe zu bringen. Danach ist der Gegner auf demselben Brett dran.","Поменяйте два соседних камня, чтобы собрать <b>3 и более</b>. Затем враг ходит на том же поле."],
 ["<b>Skulls</b> damage the foe. <b>Fire, Air, Water, Earth</b> gems fill mana for spells. <b>Stars</b> give XP. Earth gems also drop coins.","Las <b>calaveras</b> dañan al enemigo. Las gemas de <b>Fuego, Aire, Agua y Tierra</b> llenan el maná de los hechizos. Las <b>estrellas</b> dan XP. Las gemas de Tierra también sueltan monedas.","<b>Caveiras</b> ferem o inimigo. Gemas de <b>Fogo, Ar, Água e Terra</b> enchem a mana dos feitiços. <b>Estrelas</b> dão XP. Gemas de Terra também soltam moedas.","Les <b>crânes</b> blessent l'ennemi. Les gemmes de <b>Feu, d'Air, d'Eau et de Terre</b> remplissent le mana des sorts. Les <b>étoiles</b> donnent de l'XP. Les gemmes de Terre rapportent aussi des pièces.","<b>Totenköpfe</b> verletzen den Gegner. <b>Feuer-, Luft-, Wasser- und Erdsteine</b> füllen Mana für Zauber. <b>Sterne</b> geben EP. Erdsteine bringen auch Münzen.","<b>Черепа</b> ранят врага. Камни <b>Огня, Воздуха, Воды и Земли</b> наполняют ману для заклинаний. <b>Звёзды</b> дают опыт. Камни Земли также приносят монеты."],
 ["Matching <b>4+</b> in a line, or <b>5+ in an L, T or + shape</b>, gives an <b>extra turn</b>; cascades hit harder.","Combinar <b>4+</b> en línea, o <b>5+ en forma de L, T o +</b>, da un <b>turno extra</b>; las cascadas pegan más fuerte.","Combinar <b>4+</b> em linha, ou <b>5+ em forma de L, T ou +</b>, dá um <b>turno extra</b>; cascatas causam mais dano.","Aligner <b>4+</b> gemmes, ou <b>5+ en forme de L, T ou +</b>, donne un <b>tour supplémentaire</b> ; les cascades frappent plus fort.","<b>4+</b> in einer Reihe oder <b>5+ in L-, T- oder +-Form</b> bringen einen <b>Extrazug</b>; Kaskaden treffen härter.","<b>4+</b> в ряд или <b>5+ в форме L, T или +</b> дают <b>дополнительный ход</b>; каскады бьют сильнее."],
 ["Spend coins in the shop after each battle. Watch the enemy's warning for its next special move.","Gasta monedas en la tienda tras cada combate. Atiende el aviso del próximo movimiento especial del enemigo.","Gaste moedas na loja após cada batalha. Fique atento ao aviso do próximo golpe especial do inimigo.","Dépensez vos pièces à la boutique après chaque combat. Surveillez l'avertissement du prochain coup spécial de l'ennemi.","Gib nach jedem Kampf Münzen im Shop aus. Beachte die Warnung vor dem nächsten Spezialangriff des Gegners.","Тратьте монеты в магазине после каждого боя. Следите за предупреждением о следующем особом приёме врага."],
 ["<b>Keys:</b> arrows move the cursor, Space/Enter grabs a gem, then an arrow swaps it. 1-8 cast spells, H health potion, M mana potion, T hint, Esc menu.","<b>Teclas:</b> las flechas mueven el cursor, Espacio/Intro agarra una gema y luego una flecha la intercambia. 1-8 lanzan hechizos, H poción de salud, M poción de maná, T pista, Esc menú.","<b>Teclas:</b> setas movem o cursor, Espaço/Enter pega uma gema e depois uma seta a troca. 1-8 lançam feitiços, H poção de vida, M poção de mana, T dica, Esc menu.","<b>Touches :</b> les flèches déplacent le curseur, Espace/Entrée saisit une gemme, puis une flèche l'échange. 1-8 lancent les sorts, H potion de soin, M potion de mana, T indice, Échap menu.","<b>Tasten:</b> Pfeile bewegen den Cursor, Leertaste/Enter greift einen Stein, dann tauscht ihn ein Pfeil. 1-8 wirken Zauber, H Heiltrank, M Manatrank, T Tipp, Esc Menü.","<b>Клавиши:</b> стрелки двигают курсор, Пробел/Enter берёт камень, затем стрелка меняет его местами. 1-8 — заклинания, H — зелье здоровья, M — зелье маны, T — подсказка, Esc — меню."],
 ["Shards of the Ember Crown","Fragmentos de la Corona de Brasas","Fragmentos da Coroa de Brasas","Éclats de la Couronne de braise","Splitter der Glutkrone","Осколки Угольной короны"],

const DICT={es:{},pt:{},fr:{},de:{},ru:{}};
TR.forEach(r=>["es","pt","fr","de","ru"].forEach((l,i)=>{ if(r[i+1]) DICT[l][r[0]]=r[i+1]; }));
const T=(s,v)=>{ const d=DICT[Settings.lang]; let r=(d&&d[s])||s; return v?r.replace(/\{(\w+)\}/g,(m,k)=>v[k]!==undefined?v[k]:m):r; };
function detectLang(){ const codes=[...(navigator.languages||[]),navigator.language||"en"].map(x=>String(x).slice(0,2).toLowerCase()); return codes.find(c=>LANGS.some(l=>l[0]===c))||"en"; }

// ---------- settings & storage (all wrapped: storage can be blocked) ----------
const Store = {
  key:"gemhollow_save_v1", skey:"gemhollow_settings_v1",
  get(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
};
const Settings = {
  master:1, music:1, sfx:1, reduced:false, hc:false, lang:"en", langSet:false, diff:"normal",
  load(){ try{ this.reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
    const s=Store.get(Store.skey); if(s) for(const k of ["master","music","sfx","reduced","hc","lang","langSet","diff"]) if(k in s) this[k]=s[k];
    if(!this.langSet) this.lang=detectLang(); if(!LANGS.some(l=>l[0]===this.lang)) this.lang="en"; if(!DIFF[this.diff]) this.diff="normal"; this.apply(); },
  save(){ Store.set(Store.skey,{master:this.master,music:this.music,sfx:this.sfx,reduced:this.reduced,hc:this.hc,lang:this.lang,langSet:this.langSet,diff:this.diff}); },
  apply(){ document.documentElement.lang=this.lang; document.body.classList.toggle("hc",this.hc); document.body.classList.toggle("rm",this.reduced); Snd.apply(); },
};

// ---------- tutorial (non-blocking tips, shown the first time something happens) ----------
const Tut = {
  done:false, shown:{}, queue:[], cur:null, timer:null,
  T:{ start:{hl:"cv",text:"Swap two neighboring gems to line up 3 or more of the same kind. Try it now!"},
      skull:{hl:"ecard",text:"Skulls hurt your enemy. Bigger matches and cascades hit harder."},
      mana:{hl:"mana",text:"Fire, Air, Water and Earth gems fill your mana bars. Mana pays for spells."},
      spell:{hl:"spells",text:"A spell is ready! Tap a glowing spell button (or press its number). Casting doesn't end your turn."},
      extra:{hl:"cv",text:"Nice! Matching 4 or more gems in a line, or 5 in an L, T or + shape, earns an extra turn."},
      enemy:{hl:"pcard",text:"Now the enemy plays on the same board. Its skull matches hurt you, so keep an eye on your HP."},
      hint:{hl:"hint",text:"Stuck? Tap the lightbulb for a hint."} },
  reset(){ this.done=false; this.shown={}; this.queue=[]; this.hide(); },
  event(id){ if(this.done||this.shown[id]||!this.T[id]) return; this.shown[id]=true; this.queue.push(id); if(!this.cur) this.next(); },
  next(){ const id=this.queue.shift(); if(!id){ this.cur=null; return; } this.cur=id; const t=this.T[id];
    $("tiptext").textContent=T(t.text); $("tip").hidden=false; document.querySelectorAll(".hl").forEach(e=>e.classList.remove("hl")); const h=$(t.hl); if(h) (h.closest(".frame")||h).classList.add("hl");
    clearTimeout(this.timer); this.timer=setTimeout(()=>this.dismiss(id),id==="start"?20000:11000); },
  dismiss(id){ if(id&&this.cur!==id) return; this.hide(); setTimeout(()=>this.next(),400); },
  hide(){ clearTimeout(this.timer); $("tip").hidden=true; this.cur=null; document.querySelectorAll(".hl").forEach(e=>e.classList.remove("hl")); },

const costIcons = c => Object.entries(c).map(([t,n])=>`${n} ${GEMS[t].emoji}`).join(" ");

class Game {
  constructor() {
    this.p = {lv:1, xp:0, hp:50, max:50, gold:0, hpUp:0, blade:0, spellLv:SPELLS.map(()=>1), potions:{hp:1,mana:0},
      mana:{[RED]:0,[GREEN]:0,[BLUE]:0,[EARTH]:0}, shield:0, poison:0, poisonDmg:0, stunned:false};
    this.stage=0; this.best=0; this.busy=true; this.turn="player"; this.over=false; this.started=false; this.moveCount=0;
    this.floats=[]; this.parts=[]; this.fx=[]; this.hurtT={p:0,e:0}; this.shakeT=0; this.lastAct=0; this.sel=null; this.hint=null;
    this.scale=1; this.qcap=2; this.sprites={}; this.layers={}; this.dirty=3; this.ema=16; this.lastQ=0; this.lastPortrait=0; this.ach={}; this.stats={extra:0,spells:0}; this.daily={last:"",streak:0}; this.campaign=false; this.tookDamage=false; this.revived=false; this.hintHold=false; this.cursor=null; this.kb=false; this.grab=false; this.flash=null; this.lunge=0; this.after=null; this.ctx="";
    const s=Store.get(Store.key); this.hasSave=!!s; if(s) this.applySave(s);
    this.buildUI(); this.startBattle(); this.resizeCanvas();
    try{ new ResizeObserver(()=>this.resizeCanvas()).observe(cv); }catch(e){ addEventListener("resize",()=>this.resizeCanvas()); }
    requestAnimationFrame(t=>this.loop(t));
  }
  // ----- save / load -----
  recalc(){ const p=this.p; p.max=50+10*(p.lv-1)+10*p.hpUp; p.hp=Math.min(p.hp,p.max); }
  toSave(){ const p=this.p; return {v:1,lv:p.lv,xp:p.xp,gold:p.gold,stage:this.stage,best:this.best,hpUp:p.hpUp,blade:p.blade,spellLv:p.spellLv,potions:p.potions,tut:Tut.done,ach:this.ach,stats:this.stats,daily:this.daily,campaign:this.campaign,savedAt:Date.now()}; }
  applySave(s){
    const p=this.p, num=(v,d)=>Number.isFinite(v)?v:d;
    p.lv=Math.max(1,num(s.lv,1)); p.xp=Math.max(0,num(s.xp,0)); p.gold=Math.max(0,num(s.gold,0)); this.stage=Math.max(0,num(s.stage,0)); this.best=num(s.best,this.stage);
    p.hpUp=num(s.hpUp,0); p.blade=num(s.blade,0);
    if(Array.isArray(s.spellLv)) p.spellLv=SPELLS.map((_,i)=>Math.min(5,Math.max(1,num(s.spellLv[i],1))));
    if(s.potions) p.potions={hp:num(s.potions.hp,0),mana:num(s.potions.mana,0)};
    this.ach=(s.ach&&typeof s.ach==="object")?s.ach:{}; this.stats=Object.assign({extra:0,spells:0},s.stats&&typeof s.stats==="object"?s.stats:{});
    this.daily=(s.daily&&typeof s.daily.last==="string")?{last:s.daily.last,streak:num(s.daily.streak,0)}:{last:"",streak:0}; this.campaign=!!s.campaign;
    Tut.done=!!s.tut; this.recalc(); p.hp=p.max;
  }
  saveGame(){ if(!this.daily.last) this.daily.last=this.dayStr(); const d=this.toSave(); Store.set(Store.key,d); CG.dataSet(Store.key,JSON.stringify(d)); this.hasSave=true; }
  resetProgress(){ try{ localStorage.removeItem(Store.key); }catch(e){} CG.dataSet(Store.key,""); location.reload(); }
  // ----- battle setup -----
  newEnemy() {
    const st=this.stage, T=ENEMIES[st%ENEMIES.length], boss=!!T.boss;
    const df=DIFF[Settings.diff]||DIFF.normal, max=Math.round((20+14*st)*T.hm*(boss?1.5:1)*df.hp);
    this.e={name:boss?T.title:T.name, key:T.key, boss, lv:st+1, max, hp:max, atk:Math.max(1,Math.round((1+.68*st+T.ad)*df.atk)), frozen:false, shield:0, regen:!!T.regen, bonus:0,
      abil:T.ab.map(id=>({id,cd:ABIL[id].cd}))};
  }
  startBattle(){
    const p=this.p; this.recalc(); this.newEnemy(); this.newBoard();
    p.hp=p.max; for(const t of MANA_TYPES) p.mana[t]=0; p.shield=0; p.poison=0; p.stunned=false;
    if(!Tut.done && this.stage===0) p.mana[RED]=6;
    this.over=false; this.turn="player"; this.busy=false; this.sel=null; this.moveCount=0; this.fx=[]; this.after=null; this.tookDamage=false; this.revived=false; this.hintHold=false;
    this.intro=null; this.updateUI(); this.log(T("{name} appears!",{name:T(this.e.name)})+(this.e.boss?T(" Boss battle!"):""));
    const ti=this.stage%ENEMIES.length;                               // every enemy has its own music track
    if(this.e.boss&&this.started) this.bossIntro(); else { Snd.setTrackNow(ti); this.log(T("Now playing: {t}",{t:TRACKS[ti].n})); }
  }
  // ----- board -----
  mk(r,c,t){ return {t: t===undefined?this.rndType():t, x:c, y:r, tx:c, ty:r, s:1, dying:false, bad:0}; }
  rndType(){ const w=[3,2,2,2,2,1.4], sum=w.reduce((a,b)=>a+b); let x=Math.random()*sum;
    for(let i=0;i<w.length;i++){ if((x-=w[i])<0) return i; } return 0; }
  newBoard() {
    do {
      this.b = Array.from({length:N},(_,r)=>Array.from({length:N},(_,c)=>this.mk(r,c)));
    } while (this.findMatches().cells.length || !this.bestMove());
  }
  findMatches() {
    const set = new Map(), runs = [];
    const add = (cells)=>{ runs.push(cells); cells.forEach(([r,c])=>set.set(r*N+c,[r,c])); };
    for (let r=0;r<N;r++) for (let c=0;c<N;) {
      const g=this.b[r][c]; let k=c+1;
      while (g && k<N && this.b[r][k] && this.b[r][k].t===g.t) k++;
      if (g && k-c>=3) add(Array.from({length:k-c},(_,i)=>[r,c+i]));
      c=k;
    }
    for (let c=0;c<N;c++) for (let r=0;r<N;) {
      const g=this.b[r][c]; let k=r+1;
      while (g && k<N && this.b[k][c] && this.b[k][c].t===g.t) k++;
      if (g && k-r>=3) add(Array.from({length:k-r},(_,i)=>[r+i,c]));
      r=k;
    }
    return {cells:[...set.values()], runs};
  }
  // sizes of connected same-type groups made of overlapping runs (L, T and + shapes join a row and a column)
  groupSizes(runs){
    const groups=[];
    for(const run of runs){ const keys=new Set(run.map(([r,c])=>r*N+c)); const hit=[];
      groups.forEach(g=>{ if([...keys].some(k=>g.has(k))) hit.push(g); });
      const merged=new Set(keys); hit.forEach(g=>{ g.forEach(k=>merged.add(k)); groups.splice(groups.indexOf(g),1); }); groups.push(merged); }
    return groups.map(g=>g.size);
  }
  swapData(a,b){ const t=this.b[a[0]][a[1]]; this.b[a[0]][a[1]]=this.b[b[0]][b[1]]; this.b[b[0]][b[1]]=t; }
  fixTargets(){ for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const g=this.b[r][c]; if(g){g.tx=c;g.ty=r;} } }
  moves() {
    const out=[];
    for (let r=0;r<N;r++) for (let c=0;c<N;c++) for (const [dr,dc] of [[0,1],[1,0]]) {
      const r2=r+dr,c2=c+dc; if(r2>=N||c2>=N) continue;
      this.swapData([r,c],[r2,c2]);
      const m=this.findMatches(); this.swapData([r,c],[r2,c2]);
      if (m.cells.length) out.push({a:[r,c],b:[r2,c2],m});
    }
    return out;
  }
  bestMove(){
    const ms=this.moves(); if(!ms.length) return null;
    return ms;
  }
  async settle(){
    for(let i=0;i<300;i++){
      let moving=false;
      for(const row of this.b) for(const g of row) if(g){
        const dx=g.tx-g.x, dy=g.ty-g.y;
        if (Math.abs(dx)>0.01||Math.abs(dy)>0.01){ moving=true;
          g.x += Math.sign(dx)*Math.min(Math.abs(dx), Math.max(0.12,Math.abs(dx)*0.3));
          g.y += Math.sign(dy)*Math.min(Math.abs(dy), Math.max(0.15,Math.abs(dy)*0.3));
        } else { g.x=g.tx; g.y=g.ty; }
      }
      if(!moving) return;
      await frame();
    }
  }
  async trySwap(a,b,who){
    Snd.play("swap"); const ga=this.b[a[0]][a[1]], gb=this.b[b[0]][b[1]];
    this.swapData(a,b); this.fixTargets(); await this.settle();
    const m=this.findMatches();
    if(!m.cells.length){ Snd.play("bad"); ga.bad=gb.bad=performance.now(); this.swapData(a,b); this.fixTargets(); await this.settle(); return false; }
    return true;
  }
  // resolve cascades; returns true if extra turn earned
  async resolve(who, forced) {
    let extra=false, chain=0;
    while(true){
      let m;
      if (forced) { m={cells:forced, runs:[]}; forced=null; }
      else m=this.findMatches();
      if(!m.cells.length) break;
      chain++; if(who==="player"&&chain>=4) this.award("combo");
      if (m.runs.some(r=>r.length>=4)) extra=true;
      if (this.groupSizes(m.runs).some(n=>n>=5)) { if(!extra&&chain===1) this.floatText(240,300,T("BIG MATCH!"),"#ffd36b"); if(who==="player"&&!m.runs.some(r=>r.length>=5)) this.award("shape"); extra=true; }   // 5+ gems in an L, T or + shape
      const cnt={}; for(const [r,c] of m.cells){ const g=this.b[r][c]; cnt[g.t]=(cnt[g.t]||0)+1; g.dying=true; this.burst(c*60+30,r*60+30,GEMS[g.t].col); }
      { const order=Object.keys(cnt).map(Number).sort((a,b)=>cnt[b]-cnt[a]);
        order.slice(0,chain===1?3:1).forEach((ty,k)=>{
          const kind={[SKULL]:"slash",[RED]:"fire",[GREEN]:"wind",[BLUE]:"splash",[EARTH]:"rocks",[STAR]:"sparkle"}[ty];
          setTimeout(()=>Snd.elem(kind,chain===1?1:.45,cnt[ty]>=4),k*140);
          if(chain===1) this.spawnFx(ty,k*140); });
        Snd.play("match",chain); }
      const bonus = chain>1 ? 1+0.25*(chain-1) : 1;
      if(chain>1) this.floatText(240,30,T("Cascade x{n}!",{n:chain}),"#ffd36b");
      // effects
      const cx=m.cells.reduce((s,[r,c])=>s+c,0)/m.cells.length*CELL+30, cy=m.cells.reduce((s,[r,c])=>s+r,0)/m.cells.length*CELL+30;
      for(const t in cnt){ const n=cnt[t], ti=+t;
        if(ti===SKULL){
          const dmg=Math.round(n*(who==="player"?this.skullDmg():this.enemyAtk())*bonus);
          if(who==="player") await this.hurtEnemy(dmg,cx,cy); else await this.hurtPlayer(dmg,cx,cy);
        } else if(who==="player"){
          if(MANA_TYPES.includes(ti)){ this.p.mana[ti]=Math.min(MANA_MAX,this.p.mana[ti]+Math.round(n*bonus)); this.floatText(cx,cy,T("+{n} {el}",{n,el:T(GEMS[ti].name)}),GEMS[ti].col); }
          else if(ti===STAR){ const x=n*3; this.floatText(cx,cy,T("+{n} XP",{n:x}),"#c9f"); await this.addXp(x); }
        }
      }
      if(who==="player" && cnt[EARTH]) { const g=cnt[EARTH]*2; this.p.gold+=g; }
      if(who==="player"&&chain===1){ if(cnt[SKULL]) Tut.event("skull"); if(MANA_TYPES.some(t=>cnt[t])) Tut.event("mana"); }
      this.updateUI();
      await sleep(40);
      for(let i=0;i<8;i++){ for(const [r,c] of m.cells) this.b[r][c].s*=0.7; await frame(); }
      for(const [r,c] of m.cells) this.b[r][c]=null;
      if(this.over||this.e.hp<=0||this.p.hp<=0) { return extra; }
      this.gravity();
      await this.settle();
    }
    return extra;
  }
  gravity(){
    for(let c=0;c<N;c++){
      let w=N-1;
      for(let r=N-1;r>=0;r--) if(this.b[r][c]){ this.b[w][c]=this.b[r][c]; if(w!==r) this.b[r][c]=null; w--; }
      let k=0;
      for(let r=w;r>=0;r--){ k++; this.b[r][c]=this.mk(r,c); this.b[r][c].y=-k; }
    }
    this.fixTargets();
  }
  async ensureMoves(){
    if(this.moves().length) return;
    this.log(T("No moves left — reshuffling!"));
    do { for(let r=0;r<N;r++)for(let c=0;c<N;c++){ this.b[r][c]=this.mk(r,c); this.b[r][c].y=r-N; } }
    while(this.findMatches().cells.length || !this.moves().length);
    await this.settle();
  }
  // ---------- combat ----------
  skullDmg(){ return 2+Math.floor((this.p.lv-1)/2)+this.p.blade; }
  enemyAtk(){ const e=this.e; return Math.round(e.atk*(e.boss&&e.hp<e.max*.5?1.5:1)); }
  glow(id,cls){ const el=$(id); el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(()=>el.classList.remove(cls),900); }
  async hurtEnemy(d,x=240,y=60){
    const e=this.e; Snd.play("hit");
    if(e.shield>0){ const a=Math.min(d,e.shield); e.shield-=a; d-=a; this.floatText(x,y+26,T("Blocked {n}",{n:a}),"#ccd"); }
    if(d>0){ e.hp=Math.max(0,e.hp-d); this.floatText(x,y,"-"+d,"#ff7b6b"); }
    this.shake("ecard"); this.updateUI(); await sleep(150);
  }
  async hurtPlayer(d,x=240,y=420){
    const p=this.p; Snd.play("hurt");
    if(p.shield>0){ const a=Math.min(d,p.shield); p.shield-=a; d-=a; this.floatText(x,y+26,T("Blocked {n}",{n:a}),"#e8b84a"); }
    if(d>0){ p.hp=Math.max(0,p.hp-d); this.floatText(x,y,"-"+d,"#ff4d4d"); this.tookDamage=true; this.flash={col:"255,40,40",t0:performance.now(),dur:380}; }
    this.shake("pcard"); this.updateUI(); await sleep(150);
  }
  healPlayer(h){ Snd.play("heal"); const a=Math.min(h,this.p.max-this.p.hp); this.p.hp+=a; this.floatText(240,240,T("+{n} HP",{n:a}),"#6f6"); this.updateUI(); }
  need(){ return 30+(this.p.lv-1)*20; }
  async addXp(x){
    const p=this.p; p.xp+=x;
    while(p.xp>=this.need()){ p.xp-=this.need(); p.lv++; this.recalc(); p.hp=p.max; Snd.play("level");
      this.log(T("LEVEL UP! You are now level {n}. HP restored.",{n:p.lv})); this.floatText(240,240,T("LEVEL UP!"),"#ffd36b"); CG.happy(); }
    this.updateUI();
  }
  checkEnd(){
    if(this.over) return true;
    if(this.e.hp<=0){ this.winBattle(); return true; }
    if(this.p.hp<=0){ this.lose(); return true; }
    return false;
  }
  async winBattle(){
    this.over=true; this.busy=true; CG.stop(); Snd.play("win");
    const boss=this.e.boss, key=this.e.key, low=this.p.hp<this.p.max*.1, xp=Math.round((15+8*this.stage)*(boss?1.5:1)), coins=Math.round((20+10*this.stage)*(boss?2:1));
    this.p.gold+=coins; this.rewards={xp,coins,name:this.e.name,boss,campaign:false,doubled:false};
    await this.addXp(xp); this.stage++; this.best=Math.max(this.best,this.stage);
    if(this.stage===ENEMIES.length&&!this.campaign){ this.campaign=true; this.rewards.campaign=true; }   // first Elder Dragon kill: campaign complete, endless mode continues
    const first=!Tut.done; Tut.done=true; Tut.hide();
    this.award("first"); if(boss&&key==="orc") this.award("orc"); if(boss&&key==="dragon") this.award("dragon");
    if(!this.tookDamage) this.award("flawless"); if(low) this.award("clutch"); if(this.p.gold>=500) this.award("rich"); if(this.stage>=14) this.award("endless");
    if(boss) CG.happy();
    this.saveGame(); this.ctx="victory"; this.victoryPanel(first);
  }
  victoryPanel(first){
    const r=this.rewards;
    openPanel(`<h2>${r.boss?T("Boss Defeated!"):T("Victory!")}</h2><p>${T("{name} defeated.",{name:T(r.name)})}<br>${T("+{n} XP",{n:r.xp})} &nbsp; +${r.coins} ${ICO.coin}</p>
      ${r.campaign?`<p class="hint"><b>${T("Campaign complete!")}</b><br>${T("You claimed the Ember Crown. Endless mode begins: stages keep getting tougher — how far can you go?")}</p>`:""}
      ${first?`<p class="hint">${T("Spend your coins in the shop on potions and upgrades before the next battle.")}</p>`:""}
      <div class="btns"><button class="big" data-act="next">${T("Next Battle")}</button><button class="alt" data-act="shop">${T("Shop ({n})",{n:this.p.gold+" "+ICO.coin})}</button></div>
      ${CG.ready&&!r.doubled?`<div class="btns"><button class="ad" data-act="double">${T("Double coins (watch ad)")}</button></div>`:""}`);
  }
  async lose(){
    this.over=true; this.busy=true; CG.stop(); Snd.play("lose"); this.ctx="defeat"; Tut.hide();
    const xp=Math.round((15+8*this.stage)*.35), coins=Math.round((20+10*this.stage)*.35);   // consolation so retries still make progress
    this.p.gold+=coins; this.consol={xp,coins}; await this.addXp(xp); this.saveGame(); this.defeatPanel();
  }
  defeatPanel(){
    const c=this.consol||{xp:0,coins:0};
    openPanel(`<h2>${T("Defeated")}</h2><p>${T("You fell to the {name}.",{name:T(this.e.name)})}<br>${T("Consolation: +{xp} XP, +{c}",{xp:c.xp,c:c.coins+" "+ICO.coin})}<br><small>${T("Stages cleared: {n}",{n:this.stage})}${this.best?" · "+T("Best stage: {n}",{n:this.best}):""}</small></p>
      <div class="btns"><button class="big" data-act="retry">${T("Retry Battle")}</button><button class="alt" data-act="shop">${T("Shop ({n})",{n:this.p.gold+" "+ICO.coin})}</button></div>
      ${CG.ready&&!this.revived?`<div class="btns"><button class="ad" data-act="revive">${T("Revive with 50% HP (watch ad)")}</button></div>`:""}`);
  }
  async playerMove(a,b){
    if(this.busy||this.over||this.turn!=="player") return;
    this.busy=true; this.sel=null; this.hint=null; this.hintHold=false; this.grab=false;
    if(!(await this.trySwap(a,b,"player"))){ this.busy=false; return; }
    this.moveCount++; Tut.dismiss("start");
    const extra=await this.resolve("player");
    if(extra){ Tut.event("extra"); this.stats.extra++; if(this.stats.extra>=10) this.award("extra"); }
    await this.afterAction(extra);
  }
  async afterAction(extra){
    if(this.checkEnd()) return;
    await this.ensureMoves();
    if(extra){ this.log(T("Extra turn!")); this.floatText(240,240,T("EXTRA TURN!"),"#ffd36b"); this.busy=false; this.updateUI(); return; }
    await this.enemyTurn();
  }
  async beginPlayerTurn(){
    const p=this.p; this.turn="player"; this.hintHold=false;
    if(p.poison>0){ p.poison--; this.log(T("Poison burns you.")); await this.hurtPlayer(p.poisonDmg); if(this.checkEnd()) return; }
    if(p.stunned){ p.stunned=false; this.log(T("You are stunned and lose your turn!")); this.floatText(240,240,T("STUNNED"),"#ffe14a"); this.updateUI(); await sleep(800); return this.enemyTurn(); }
    this.busy=false; this.updateUI();
    if(this.moveCount>0 && SPELLS.some((s,i)=>Object.keys(s.cost).every(t=>p.mana[t]>=s.cost[t]))) Tut.event("spell");
  }
  async telegraph(name){
    this.log(T("{name} uses {a}!",{name:T(this.e.name),a:T(name)})); this.lunge=performance.now(); this.flash={col:"170,60,255",t0:performance.now(),dur:500};
    Snd.play("ability"); this.floatText(240,200,T(name)+"!","#ffe08a"); await sleep(650);
  }
  async enemyTurn(){
    this.turn="enemy"; this.busy=true; this.updateUI(); Tut.event("enemy"); const e=this.e;
    await sleep(350);
    if(e.regen&&e.hp<e.max){ const h=Math.round(e.max*.05); e.hp=Math.min(e.max,e.hp+h); this.floatText(240,40,"+"+h,"#6f6"); this.updateUI(); }

  fxBoss(p,t,rr,f){

    for(let k=0;k<3;k++){ const r=post*(380+k*160)-k*30; if(r<=0) continue; ctx.strokeStyle=`rgba(255,${kind==="dragon"?150:210},${kind==="dragon"?40:150},${Math.max(0,.9*(1-post))})`; ctx.lineWidth=16*(1-post)+2; ctx.beginPath(); ctx.arc(ox,oy,r,0,6.2832); ctx.stroke(); }

        ctx.save(); ctx.translate(x,y); ctx.rotate(tt*(rr(k)*10-5)); ctx.fillStyle="#6a5230"; ctx.strokeStyle="#2c1f10"; ctx.lineWidth=2; ctx.beginPath();

  // ---------- match animations (full-board, initial match only) ----------
  spawnFx(type,delay=0,o={}){
    const dur={[SKULL]:700,[RED]:900,[GREEN]:900,[BLUE]:950,[EARTH]:1000,[STAR]:700,fireball:950,frost:1000,bolt:800,ring:900,meteor:1000,burn:900,boss:2600}[type]||800;
    if(Settings.reduced||(Settings.lowFx&&typeof type==="number")){ if(typeof type==="string") this.flash={col:"255,255,255",t0:performance.now()+delay,dur:300,a:.25}; return; }   // reduced motion: no full-board effects
    this.fx.push({type,born:performance.now()+delay,dur,seed:Math.random()*1000,o});
    if(type===EARTH) setTimeout(()=>{ this.shakeT=Math.max(this.shakeT,7); },delay+dur*.4);
    if(type==="meteor") setTimeout(()=>{ this.shakeT=Math.max(this.shakeT,14); },delay+dur*.5);
  }
  drawFx(t){
    this.fx=this.fx.filter(f=>t-f.born<f.dur);
    for(const f of this.fx){
      const p=(t-f.born)/f.dur; if(p<0) continue;
      const rr=i=>{ const x=Math.sin(f.seed+i*12.9898)*43758.5453; return x-Math.floor(x); };
      ctx.save();
      ({[RED]:this.fxFire,[BLUE]:this.fxWater,[GREEN]:this.fxWind,[EARTH]:this.fxRocks,[SKULL]:this.fxSlash,[STAR]:this.fxSpark,
        fireball:this.fxFireball,frost:this.fxFrost,bolt:this.fxBolt,ring:this.fxRing,meteor:this.fxMeteor,burn:this.fxBurn,boss:this.fxBoss}[f.type]).call(this,p,t,rr,f);
      ctx.restore();
    }
  }
  fxFire(p,t,rr){

  }
  fxWater(p,t,rr){

  }

function shade(hex,amt){
  const n=parseInt(hex.slice(1),16); const f=v=>Math.max(0,Math.min(255,v+amt));
  return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`;
}

cv.addEventListener("pointermove",e=>{
  if(!down||game.busy) return;
  const dx=e.clientX-down.x, dy=e.clientY-down.y;
  if(Math.hypot(dx,dy)<Math.max(10,cv.getBoundingClientRect().width/N*.28)) return;
  const [r,c]=down.cell; const t=Math.abs(dx)>Math.abs(dy)?[r,c+Math.sign(dx)]:[r+Math.sign(dy),c];
  down=null;
  if(t[0]>=0&&t[0]<N&&t[1]>=0&&t[1]<N) game.playerMove([r,c],t);
});
window.addEventListener("pointerup",()=>{ down=null; });
window.addEventListener("pointercancel",()=>{ down=null; });
</script>
</body>
</html>
