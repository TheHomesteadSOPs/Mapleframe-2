  r=Math.min(Array.isArray(r)?r[0]:(r||0),w/2,h/2); this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); };

const $ = id => document.getElementById(id);
let FAST = /[?&]fast\b/.test(location.search);   // test hook: skip waits
let PAUSED = false, waiters = [];
const gate = () => PAUSED ? new Promise(r=>waiters.push(r)) : null;
const setPaused = v => { PAUSED=v; if(!v) waiters.splice(0).forEach(r=>r()); };
let GEN = 0;                                   // bumped on restart: abandons in-flight turn logic
const dead = () => new Promise(()=>{});
const sleep = async ms => { const g0=GEN; if(!FAST) await new Promise(r=>setTimeout(r,ms)); const g=gate(); if(g) await g; if(g0!==GEN) await dead(); };
const frame = async () => { const g0=GEN; if(FAST) await Promise.resolve(); else await new Promise(r=>requestAnimationFrame(r)); const g=gate(); if(g) await g; if(g0!==GEN) await dead(); };
const rnd = n => Math.floor(Math.random()*n);

  {name:"Smite", cost:{[EARTH]:6,[RED]:2}, desc:L=>`Destroy all skulls, ${Math.round(3*mult(L))} dmg each`,
    async run(g,L){ const cells=[]; for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(g.b[r][c]&&g.b[r][c].t===SKULL) cells.push([r,c]);
      g.spawnFx("bolt",0,{cells}); await sleep(450); g.after={cells,per:Math.round(3*mult(L))}; }},
  {name:"Wildfire", cost:{[RED]:5,[GREEN]:3}, desc:L=>`Burn a row and column, ${Math.round(2*mult(L))} dmg per gem`,
    async run(g,L){ const row=rnd(N), col=rnd(N), cells=[]; for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(r===row||c===col) cells.push([r,c]);
      g.spawnFx("burn",0,{row,col}); g.spawnFx(RED,100); await sleep(500); g.after={cells,per:Math.round(2*mult(L))}; }},
  {name:"Cleanse", cost:{[BLUE]:3,[GREEN]:3}, desc:L=>`Cure poison & stun, heal ${Math.round(8*mult(L))}`,

  {name:"Stoneskin", cost:{[EARTH]:5}, desc:L=>`Block the next ${Math.round(14*mult(L))} damage`,
    async run(g,L){ g.spawnFx("ring",0,{col:"#e8b84a"}); g.spawnFx(EARTH); await sleep(300); g.p.shield+=Math.round(14*mult(L)); g.floatText(240,240,"+Shield","#e8b84a"); }},
  {name:"Meteor", cost:{[RED]:5,[EARTH]:6}, desc:L=>`${Math.round(26*mult(L))} damage, shakes the board`,
    async run(g,L){ g.spawnFx("meteor"); await sleep(560); await g.hurtEnemy(Math.round(26*mult(L))); }},
];

  pilfer:{name:"Pilfer", cd:5, info:"steals coins", async run(g){ const n=Math.min(g.p.gold,5+2*g.stage); g.p.gold-=n; g.floatText(240,240,n?`-${n} coins`:"Nothing to steal","#ffd36b"); }},

// ---------- tutorial (non-blocking tips, shown the first time something happens) ----------
const Tut = {
  done:false, shown:{}, queue:[], cur:null, timer:null,
  T:{ start:{hl:"cv",text:"Swap two neighboring gems to line up 3 or more of the same kind. Try it now!"},
      skull:{hl:"ecard",text:"Skulls hurt your enemy. Bigger matches and cascades hit harder."},
      mana:{hl:"mana",text:"Fire, Air, Water and Earth gems fill your mana bars. Mana pays for spells."},
      spell:{hl:"spells",text:"A spell is ready! Tap a glowing spell button (or press its number). Casting doesn't end your turn."},
      extra:{hl:"cv",text:"Nice! Matching 4 or more gems in a line, or 5 in an L, T or + shape, earns an extra turn."},
      enemy:{hl:"pcard",text:"Now the enemy plays on the same board. Its skull matches hurt you, so keep an eye on your HP."} },
  reset(){ this.done=false; this.shown={}; this.queue=[]; this.hide(); },
  event(id){ if(this.done||this.shown[id]||!this.T[id]) return; this.shown[id]=true; this.queue.push(id); if(!this.cur) this.next(); },
  next(){ const id=this.queue.shift(); if(!id){ this.cur=null; return; } this.cur=id; const t=this.T[id];
    $("tiptext").textContent=t.text; $("tip").hidden=false; document.querySelectorAll(".hl").forEach(e=>e.classList.remove("hl")); const h=$(t.hl); if(h) (h.closest(".frame")||h).classList.add("hl");
    clearTimeout(this.timer); this.timer=setTimeout(()=>this.dismiss(id),id==="start"?20000:11000); },
  dismiss(id){ if(id&&this.cur!==id) return; this.hide(); setTimeout(()=>this.next(),400); },
  hide(){ clearTimeout(this.timer); $("tip").hidden=true; this.cur=null; document.querySelectorAll(".hl").forEach(e=>e.classList.remove("hl")); },
};

const costIcons = c => Object.entries(c).map(([t,n])=>`${n} ${GEMS[t].emoji}`).join(" ");

class Game {
  constructor() {
    this.p = {lv:1, xp:0, hp:50, max:50, gold:0, hpUp:0, blade:0, spellLv:SPELLS.map(()=>1), potions:{hp:1,mana:0},
      mana:{[RED]:0,[GREEN]:0,[BLUE]:0,[EARTH]:0}, shield:0, poison:0, poisonDmg:0, stunned:false};
    this.stage=0; this.best=0; this.busy=true; this.turn="player"; this.over=false; this.started=false; this.moveCount=0;
    this.floats=[]; this.parts=[]; this.fx=[]; this.hurtT={p:0,e:0}; this.shakeT=0; this.lastAct=0; this.sel=null; this.hint=null;
    this.scale=1; this.qcap=2; this.sprites={}; this.layers={}; this.dirty=3; this.ema=16; this.lastQ=0; this.lastPortrait=0; this.cursor=null; this.kb=false; this.grab=false; this.flash=null; this.lunge=0; this.after=null; this.ctx="";
    const s=Store.get(Store.key); this.hasSave=!!s; if(s) this.applySave(s);
    this.buildUI(); this.startBattle(); this.resizeCanvas();
    try{ new ResizeObserver(()=>this.resizeCanvas()).observe(cv); }catch(e){ addEventListener("resize",()=>this.resizeCanvas()); }
    requestAnimationFrame(t=>this.loop(t));
  }
  // ----- save / load -----
  recalc(){ const p=this.p; p.max=50+10*(p.lv-1)+10*p.hpUp; p.hp=Math.min(p.hp,p.max); }
  toSave(){ const p=this.p; return {v:1,lv:p.lv,xp:p.xp,gold:p.gold,stage:this.stage,best:this.best,hpUp:p.hpUp,blade:p.blade,spellLv:p.spellLv,potions:p.potions,tut:Tut.done,savedAt:Date.now()}; }
  applySave(s){
    const p=this.p, num=(v,d)=>Number.isFinite(v)?v:d;
    p.lv=Math.max(1,num(s.lv,1)); p.xp=Math.max(0,num(s.xp,0)); p.gold=Math.max(0,num(s.gold,0)); this.stage=Math.max(0,num(s.stage,0)); this.best=num(s.best,this.stage);
    p.hpUp=num(s.hpUp,0); p.blade=num(s.blade,0);
    if(Array.isArray(s.spellLv)) p.spellLv=SPELLS.map((_,i)=>Math.min(5,Math.max(1,num(s.spellLv[i],1))));
    if(s.potions) p.potions={hp:num(s.potions.hp,0),mana:num(s.potions.mana,0)};
    Tut.done=!!s.tut; this.recalc(); p.hp=p.max;
  }
  saveGame(){ const d=this.toSave(); Store.set(Store.key,d); CG.dataSet(Store.key,JSON.stringify(d)); this.hasSave=true; }
  resetProgress(){ try{ localStorage.removeItem(Store.key); }catch(e){} CG.dataSet(Store.key,""); location.reload(); }
  // ----- battle setup -----
  newEnemy() {
    const st=this.stage, T=ENEMIES[st%ENEMIES.length], boss=!!T.boss;
    const max=Math.round((20+14*st)*T.hm*(boss?1.5:1));
    this.e={name:boss?T.title:T.name, key:T.key, boss, lv:st+1, max, hp:max, atk:Math.max(1,Math.round(1+.75*st+T.ad)), frozen:false, shield:0, regen:!!T.regen, bonus:0,
      abil:T.ab.map(id=>({id,cd:ABIL[id].cd}))};
  }
  startBattle(){
    const p=this.p; this.recalc(); this.newEnemy(); this.newBoard();
    p.hp=p.max; for(const t of MANA_TYPES) p.mana[t]=0; p.shield=0; p.poison=0; p.stunned=false;
    if(!Tut.done && this.stage===0) p.mana[RED]=6;
    this.over=false; this.turn="player"; this.busy=false; this.sel=null; this.moveCount=0; this.fx=[]; this.after=null;
    this.updateUI(); this.log(`${this.e.name} appears!${this.e.boss?" Boss battle!":""}`);
  }
  // ----- board -----
  mk(r,c,t){ return {t: t===undefined?this.rndType():t, x:c, y:r, tx:c, ty:r, s:1, dying:false, bad:0}; }
  rndType(){ const w=[3,2,2,2,2,1.4], sum=w.reduce((a,b)=>a+b); let x=Math.random()*sum;
    for(let i=0;i<w.length;i++){ if((x-=w[i])<0) return i; } return 0; }
  newBoard() {
    do {
      this.b = Array.from({length:N},(_,r)=>Array.from({length:N},(_,c)=>this.mk(r,c)));
    } while (this.findMatches().cells.length || !this.bestMove());
  }
  findMatches() {
    const set = new Map(), runs = [];
    const add = (cells)=>{ runs.push(cells); cells.forEach(([r,c])=>set.set(r*N+c,[r,c])); };
    for (let r=0;r<N;r++) for (let c=0;c<N;) {
      const g=this.b[r][c]; let k=c+1;
      while (g && k<N && this.b[r][k] && this.b[r][k].t===g.t) k++;
      if (g && k-c>=3) add(Array.from({length:k-c},(_,i)=>[r,c+i]));
      c=k;
    }
    for (let c=0;c<N;c++) for (let r=0;r<N;) {
      const g=this.b[r][c]; let k=r+1;
      while (g && k<N && this.b[k][c] && this.b[k][c].t===g.t) k++;
      if (g && k-r>=3) add(Array.from({length:k-r},(_,i)=>[r+i,c]));
      r=k;
    }
    return {cells:[...set.values()], runs};
  }
  // sizes of connected same-type groups made of overlapping runs (L, T and + shapes join a row and a column)
  groupSizes(runs){
    const groups=[];
    for(const run of runs){ const keys=new Set(run.map(([r,c])=>r*N+c)); const hit=[];
      groups.forEach(g=>{ if([...keys].some(k=>g.has(k))) hit.push(g); });
      const merged=new Set(keys); hit.forEach(g=>{ g.forEach(k=>merged.add(k)); groups.splice(groups.indexOf(g),1); }); groups.push(merged); }
    return groups.map(g=>g.size);
  }
  swapData(a,b){ const t=this.b[a[0]][a[1]]; this.b[a[0]][a[1]]=this.b[b[0]][b[1]]; this.b[b[0]][b[1]]=t; }
  fixTargets(){ for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const g=this.b[r][c]; if(g){g.tx=c;g.ty=r;} } }
  moves() {
    const out=[];
    for (let r=0;r<N;r++) for (let c=0;c<N;c++) for (const [dr,dc] of [[0,1],[1,0]]) {
      const r2=r+dr,c2=c+dc; if(r2>=N||c2>=N) continue;
      this.swapData([r,c],[r2,c2]);
      const m=this.findMatches(); this.swapData([r,c],[r2,c2]);
      if (m.cells.length) out.push({a:[r,c],b:[r2,c2],m});
    }
    return out;
  }
  bestMove(){
    const ms=this.moves(); if(!ms.length) return null;
    return ms;
  }
  async settle(){
    for(let i=0;i<300;i++){
      let moving=false;
      for(const row of this.b) for(const g of row) if(g){
        const dx=g.tx-g.x, dy=g.ty-g.y;
        if (Math.abs(dx)>0.01||Math.abs(dy)>0.01){ moving=true;
          g.x += Math.sign(dx)*Math.min(Math.abs(dx), Math.max(0.12,Math.abs(dx)*0.3));
          g.y += Math.sign(dy)*Math.min(Math.abs(dy), Math.max(0.15,Math.abs(dy)*0.3));
        } else { g.x=g.tx; g.y=g.ty; }
      }
      if(!moving) return;
      await frame();
    }
  }
  async trySwap(a,b,who){
    Snd.play("swap"); const ga=this.b[a[0]][a[1]], gb=this.b[b[0]][b[1]];
    this.swapData(a,b); this.fixTargets(); await this.settle();
    const m=this.findMatches();
    if(!m.cells.length){ Snd.play("bad"); ga.bad=gb.bad=performance.now(); this.swapData(a,b); this.fixTargets(); await this.settle(); return false; }
    return true;
  }
  // resolve cascades; returns true if extra turn earned
  async resolve(who, forced) {
    let extra=false, chain=0;
    while(true){
      let m;
      if (forced) { m={cells:forced, runs:[]}; forced=null; }
      else m=this.findMatches();
      if(!m.cells.length) break;
      chain++;
      if (m.runs.some(r=>r.length>=4)) extra=true;
      if (this.groupSizes(m.runs).some(n=>n>=5)) { if(!extra&&chain===1) this.floatText(240,300,"BIG MATCH!","#ffd36b"); extra=true; }   // 5+ gems in an L, T or + shape
      const cnt={}; for(const [r,c] of m.cells){ const g=this.b[r][c]; cnt[g.t]=(cnt[g.t]||0)+1; g.dying=true; this.burst(c*60+30,r*60+30,GEMS[g.t].col); }
      { const order=Object.keys(cnt).map(Number).sort((a,b)=>cnt[b]-cnt[a]);
        order.slice(0,chain===1?3:1).forEach((ty,k)=>{
          const kind={[SKULL]:"slash",[RED]:"fire",[GREEN]:"wind",[BLUE]:"splash",[EARTH]:"rocks",[STAR]:"sparkle"}[ty];
          setTimeout(()=>Snd.elem(kind,chain===1?1:.45,cnt[ty]>=4),k*140);
          if(chain===1) this.spawnFx(ty,k*140); });
        Snd.play("match",chain); }
      const bonus = chain>1 ? 1+0.25*(chain-1) : 1;
      if(chain>1) this.floatText(240,30,`Cascade x${chain}!`,"#ffd36b");
      // effects
      const cx=m.cells.reduce((s,[r,c])=>s+c,0)/m.cells.length*CELL+30, cy=m.cells.reduce((s,[r,c])=>s+r,0)/m.cells.length*CELL+30;
      for(const t in cnt){ const n=cnt[t], ti=+t;
        if(ti===SKULL){
          const dmg=Math.round(n*(who==="player"?this.skullDmg():this.enemyAtk())*bonus);
          if(who==="player") await this.hurtEnemy(dmg,cx,cy); else await this.hurtPlayer(dmg,cx,cy);
        } else if(who==="player"){
          if(MANA_TYPES.includes(ti)){ this.p.mana[ti]=Math.min(MANA_MAX,this.p.mana[ti]+Math.round(n*bonus)); this.floatText(cx,cy,`+${n} ${GEMS[ti].name}`,GEMS[ti].col); }
          else if(ti===STAR){ const x=n*3; this.floatText(cx,cy,`+${x} XP`,"#c9f"); await this.addXp(x); }
        }
      }
      if(who==="player" && cnt[EARTH]) { const g=cnt[EARTH]*2; this.p.gold+=g; }
      if(who==="player"&&chain===1){ if(cnt[SKULL]) Tut.event("skull"); if(MANA_TYPES.some(t=>cnt[t])) Tut.event("mana"); }
      this.updateUI();
      await sleep(40);
      for(let i=0;i<8;i++){ for(const [r,c] of m.cells) this.b[r][c].s*=0.7; await frame(); }
      for(const [r,c] of m.cells) this.b[r][c]=null;
      if(this.over||this.e.hp<=0||this.p.hp<=0) { return extra; }
      this.gravity();
      await this.settle();
    }
    return extra;
  }
  gravity(){
    for(let c=0;c<N;c++){
      let w=N-1;
      for(let r=N-1;r>=0;r--) if(this.b[r][c]){ this.b[w][c]=this.b[r][c]; if(w!==r) this.b[r][c]=null; w--; }
      let k=0;
      for(let r=w;r>=0;r--){ k++; this.b[r][c]=this.mk(r,c); this.b[r][c].y=-k; }
    }
    this.fixTargets();
  }
  async ensureMoves(){
    if(this.moves().length) return;
    this.log("No moves left — reshuffling!");
    do { for(let r=0;r<N;r++)for(let c=0;c<N;c++){ this.b[r][c]=this.mk(r,c); this.b[r][c].y=r-N; } }
    while(this.findMatches().cells.length || !this.moves().length);
    await this.settle();
  }
  // ---------- combat ----------
  skullDmg(){ return 2+Math.floor((this.p.lv-1)/2)+this.p.blade; }
  enemyAtk(){ const e=this.e; return Math.round(e.atk*(e.boss&&e.hp<e.max*.5?1.5:1)); }
  glow(id,cls){ const el=$(id); el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(()=>el.classList.remove(cls),900); }
  async hurtEnemy(d,x=240,y=60){
    const e=this.e; Snd.play("hit");
    if(e.shield>0){ const a=Math.min(d,e.shield); e.shield-=a; d-=a; this.floatText(x,y+26,"Blocked "+a,"#ccd"); }
    if(d>0){ e.hp=Math.max(0,e.hp-d); this.floatText(x,y,"-"+d,"#ff7b6b"); }
    this.shake("ecard"); this.updateUI(); await sleep(150);
  }
  async hurtPlayer(d,x=240,y=420){
    const p=this.p; Snd.play("hurt");
    if(p.shield>0){ const a=Math.min(d,p.shield); p.shield-=a; d-=a; this.floatText(x,y+26,"Blocked "+a,"#e8b84a"); }
    if(d>0){ p.hp=Math.max(0,p.hp-d); this.floatText(x,y,"-"+d,"#ff4d4d"); this.flash={col:"255,40,40",t0:performance.now(),dur:380}; }
    this.shake("pcard"); this.updateUI(); await sleep(150);
  }
  healPlayer(h){ Snd.play("heal"); const a=Math.min(h,this.p.max-this.p.hp); this.p.hp+=a; this.floatText(240,240,"+"+a+" HP","#6f6"); this.updateUI(); }
  need(){ return 30+(this.p.lv-1)*20; }
  async addXp(x){
    const p=this.p; p.xp+=x;
    while(p.xp>=this.need()){ p.xp-=this.need(); p.lv++; this.recalc(); p.hp=p.max; Snd.play("level"); Snd.setTrack((p.lv-1)%10);
      this.log(`LEVEL UP! You are now level ${p.lv}. HP restored. Now playing: ${TRACKS[(p.lv-1)%10].n}`); this.floatText(240,240,"LEVEL UP!","#ffd36b"); }
    this.updateUI();
  }
  checkEnd(){
    if(this.over) return true;
    if(this.e.hp<=0){ this.winBattle(); return true; }
    if(this.p.hp<=0){ this.lose(); return true; }
    return false;
  }
  async winBattle(){
    this.over=true; this.busy=true; CG.stop(); Snd.play("win");
    const boss=this.e.boss, xp=Math.round((15+8*this.stage)*(boss?1.5:1)), coins=Math.round((20+10*this.stage)*(boss?2:1));
    this.p.gold+=coins; this.rewards={xp,coins,name:this.e.name,boss};
    await this.addXp(xp); this.stage++; this.best=Math.max(this.best,this.stage);
    const first=!Tut.done; Tut.done=true; Tut.hide(); this.saveGame(); this.ctx="victory"; this.victoryPanel(first);
  }
  victoryPanel(first){
    const r=this.rewards;

    const hint=this.hint&&this.hint.some(([hr,hc])=>hr===g.ty&&hc===g.tx);
    if(sel) k*=1+0.05*Math.sin(t/90)+0.08;
    if(hint) k*=1+0.08*Math.sin(t/140);
    const sp=this.sprite(g.t), size=sp.SP*k; ctx.drawImage(sp.c,cx-size/2,cy-size/2,size,size);
    const r=S*.4*k;
    if(sel){ ctx.lineWidth=3; const rc=this.turn==="enemy"?"#ff5a5a":"#ffd36b"; ctx.strokeStyle=rc; ctx.shadowColor=rc; ctx.shadowBlur=12; this.gemPath(g.t,cx,cy,r*1.15); ctx.stroke(); ctx.shadowBlur=0; }
    if(bad){ ctx.lineWidth=3; ctx.strokeStyle=`rgba(255,70,70,${1-(t-g.bad)/360})`; this.gemPath(g.t,cx,cy,r*1.12); ctx.stroke(); }
  }
  needsBoard(t){
    if(this.dirty>0||this.fx.length||this.parts.length||this.floats.length||this.flash||this.shakeT>0||this.sel||this.hint||(this.kb&&this.cursor)||this.turn==="enemy") return true;
    for(const row of this.b) for(const g of row) if(g&&(g.s!==1||g.x!==g.tx||g.y!==g.ty||t-g.bad<400)) return true;
    return false;
  }
  loop(t=0){
    requestAnimationFrame(tt=>this.loop(tt));
    // adaptive quality: if frames stay slow, lower canvas resolution, then disable full-board match effects
    const dt=Math.min(100,t-(this.lastT||t)); this.lastT=t; this.ema+=(dt-this.ema)*.05;
    if(t>3000&&t-this.lastQ>1500&&this.ema>30&&!document.hidden){ this.lastQ=t;
      if(this.qcap>.8){ this.qcap=Math.max(.75,this.qcap*.8); this.resizeCanvas(); } else if(!Settings.lowFx){ Settings.lowFx=true; } }
    // idle hint
    if(this.turn==="player"&&!this.busy&&!this.over){
      if(!this.hint&&t-this.lastAct>6000){ const m=this.moves(); if(m.length) this.hint=[m[0].a,m[0].b]; }
    } else this.hint=null;
    if(this.needsBoard(t)){
      if(this.dirty>0) this.dirty--;
      const S=480/N, sc=this.scale;
      ctx.setTransform(sc,0,0,sc,0,0); ctx.clearRect(-20,-20,520,520);
      if(this.shakeT>0){ this.shakeT*=0.88; if(this.shakeT<0.3) this.shakeT=0; ctx.translate((Math.random()-.5)*this.shakeT,(Math.random()-.5)*this.shakeT); }
      ctx.drawImage(this.layer("bg"),-20,-20,520,520);
      for(const row of this.b) for(const g of row) if(g) this.drawGem(g,S,t);
      this.parts=this.parts.filter(p=>--p.life>0);
      for(const p of this.parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; ctx.globalAlpha=Math.min(1,p.life/p.max*1.5); ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life/p.max+.5,0,6.2832); ctx.fill(); }
      ctx.globalAlpha=1;
      if(this.sel&&this.turn==="player"){ ctx.fillStyle="#ffd36b33"; for(const [dr,dc] of [[0,1],[1,0],[0,-1],[-1,0]]){ const r2=this.sel[0]+dr,c2=this.sel[1]+dc; if(r2>=0&&r2<N&&c2>=0&&c2<N){ ctx.beginPath(); ctx.arc(c2*S+S/2,r2*S+S/2,S*.46,0,6.2832); ctx.fill(); } } }
      if(this.kb&&this.cursor&&this.turn==="player"&&!this.over){ const [r,c]=this.cursor; ctx.lineWidth=3; ctx.strokeStyle=this.grab?"#ffd36b":"#fff"; ctx.setLineDash(this.grab?[]:[6,5]); ctx.strokeRect(c*S+4,r*S+4,S-8,S-8); ctx.setLineDash([]); }
      this.drawFx(t);
      if(this.flash){ const q=(t-this.flash.t0)/this.flash.dur; if(q>=1) this.flash=null; else if(q>=0){ ctx.fillStyle=`rgba(${this.flash.col},${(this.flash.a||.4)*(1-q)})`; ctx.fillRect(-20,-20,520,520); } }
      ctx.drawImage(this.layer("vig"),-20,-20,520,520);
      ctx.font="900 24px 'Palatino Linotype',Georgia,serif"; ctx.textAlign="center"; ctx.textBaseline="alphabetic";
      this.floats=this.floats.filter(f=>--f.life>0);
      for(const f of this.floats){ ctx.globalAlpha=Math.min(1,f.life/20); ctx.fillStyle=f.color; ctx.strokeStyle="#000"; ctx.lineWidth=5; ctx.lineJoin="round";
        const y=f.y-(60-f.life)*0.8, sc2=1+Math.max(0,(f.life-52))*0.05; ctx.save(); ctx.translate(f.x,y); ctx.scale(sc2,sc2);
        ctx.strokeText(f.text,0,0); ctx.fillText(f.text,0,0); ctx.restore(); }
      ctx.globalAlpha=1;
    }
    // portraits: ~20fps while idle, every frame while reacting
    const kick=Math.max(0,1-(t-this.lunge)/450), rm=Settings.reduced, hp=this.hurtT.p-t>0, he=this.hurtT.e-t>0;
    if(hp||he||kick>0||t-this.lastPortrait>50){ this.lastPortrait=t;
      Fig.draw($("pcv"),"hero",t,rm?0:hp?6:0,0,rm); Fig.draw($("ecv"),this.e.key,t,rm?0:he?6:0,rm?0:Math.sin(kick*Math.PI),rm); }
  }
}

function shade(hex,amt){
  const n=parseInt(hex.slice(1),16); const f=v=>Math.max(0,Math.min(255,v+amt));
  return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`;
}

Settings.load();
const game = new Game();
game.homePanel();
CG.init().then(()=>{ CG.loaded();
  try{ const raw=CG.dataGet(Store.key); if(raw&&!game.started){ const c=JSON.parse(raw), l=Store.get(Store.key);   // cloud save newer than local? use it
    if(c&&c.savedAt&&(!l||c.savedAt>l.savedAt)){ Store.set(Store.key,c); game.applySave(c); game.hasSave=true; game.startBattle(); game.homePanel(); } } }catch(e){} });

// ---------- toolbar ----------
const muteBtn=document.getElementById("mute"), syncMute=()=>muteBtn.classList.toggle("off",Snd.muted);
muteBtn.onclick=()=>{ Snd.init(); Snd.setMuted(!Snd.muted); syncMute(); }; syncMute();
document.getElementById("menu").onclick=()=>game.openMenu();
$("tipok").onclick=()=>Tut.dismiss(Tut.cur);
$("panel").addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(b&&!b.disabled){ Snd.init(); Snd.play("click"); game.act(b.dataset.act,b.dataset); } });
$("panel").addEventListener("input",e=>{ const k=e.target.dataset.set; if(k&&e.target.type==="range"){ Settings[k]=e.target.value/100; Settings.apply(); } });
$("panel").addEventListener("change",e=>{ const k=e.target.dataset.set; if(!k) return;
  if(k==="mute"){ Snd.setMuted(e.target.checked); syncMute(); } else if(e.target.type==="checkbox"){ Settings[k]=e.target.checked; Settings.apply(); }
  Settings.save(); });
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(panelOpen()){
    if(e.key==="Escape"&&game.ctx==="menu"){ e.preventDefault(); closePanel(); }
    else if(e.key==="Tab"){ const f=[...$("panelbox").querySelectorAll("button:not([disabled]),input")]; if(!f.length) return;
      const i=f.indexOf(document.activeElement), n=e.shiftKey?(i<=0?f.length-1:i-1):(i===f.length-1?0:i+1); e.preventDefault(); f[n].focus(); }
    return; }
  if(!game.started) return;
  const k=e.key, dirs={ArrowLeft:[0,-1],ArrowRight:[0,1],ArrowUp:[-1,0],ArrowDown:[1,0]};
  if(dirs[k]){ e.preventDefault(); game.kb=true; game.kbMove(...dirs[k]); }
  else if(k===" "||k==="Enter"){ if(e.target.tagName==="BUTTON") return; e.preventDefault(); game.kb=true; game.kbSelect(); }
  else if(k==="Escape"||k==="p"||k==="P") game.openMenu();
  else if(/^[1-8]$/.test(k)) game.cast(+k-1);
  else if(k==="h"||k==="H") game.usePotion("hp");
  else if(k==="m"||k==="M") game.usePotion("mana");
});
{ const d=document.documentElement; if(!(d.requestFullscreen||d.webkitRequestFullscreen)) document.getElementById("fs").style.display="none"; }
document.getElementById("fs").onclick=()=>{ const d=document.documentElement;
  try{ document.fullscreenElement?document.exitFullscreen():(d.requestFullscreen||d.webkitRequestFullscreen).call(d); }catch(e){} };

// ---------- input ----------
let down=null;
const cellAt=e=>{ const R=cv.getBoundingClientRect(); const c=Math.floor((e.clientX-R.left)/R.width*N), r=Math.floor((e.clientY-R.top)/R.height*N);
  return (r>=0&&r<N&&c>=0&&c<N)?[r,c]:null; };
const adj=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])===1;
cv.addEventListener("pointerdown",e=>{
  game.kb=false;
  if(game.busy||game.over||game.turn!=="player") return;
  const cell=cellAt(e); if(!cell) return;
  if(game.sel && adj(game.sel,cell)){ const a=game.sel; game.playerMove(a,cell); down=null; return; }
  game.sel=cell; down={cell,x:e.clientX,y:e.clientY};
});
cv.addEventListener("pointermove",e=>{
  if(!down||game.busy) return;
  const dx=e.clientX-down.x, dy=e.clientY-down.y;
  if(Math.hypot(dx,dy)<Math.max(10,cv.getBoundingClientRect().width/N*.28)) return;
  const [r,c]=down.cell; const t=Math.abs(dx)>Math.abs(dy)?[r,c+Math.sign(dx)]:[r+Math.sign(dy),c];
  down=null;
  if(t[0]>=0&&t[0]<N&&t[1]>=0&&t[1]<N) game.playerMove([r,c],t);
});
window.addEventListener("pointerup",()=>{ down=null; });
window.addEventListener("pointercancel",()=>{ down=null; });
</script>
