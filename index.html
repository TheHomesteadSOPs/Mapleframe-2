<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Gemhollow</title>
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
  :root { --bg:#0e0a18; --panel:#2a1f45; --panel2:#1c1430; --edge:#6a52a8; --gold:#ffd36b; --txt:#f3ecff; --dim:#b3a6d4; }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--txt); font-family:'Palatino Linotype','Book Antiqua',Georgia,serif;
    background:radial-gradient(ellipse at 50% 0%,#3a2670 0%,#1a1030 45%,var(--bg) 100%) fixed;
    display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:8px; user-select:none; touch-action:none; }
  h1 { font-size:26px; margin:2px 0 8px; letter-spacing:6px; font-weight:900;
    background:linear-gradient(#fff3c4,#ffb82e 55%,#b86a00); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 0 #0008) drop-shadow(0 0 10px #ff9a2e66); }
  #game { width:100%; max-width:520px; display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; gap:8px; }
  .card { flex:1; background:linear-gradient(#34265a,var(--panel2)); border:2px solid var(--edge); border-radius:12px; padding:8px 10px;
    position:relative; box-shadow:inset 0 1px 0 #fff2,0 4px 12px #0008; transition:border-color .3s, box-shadow .3s; }
  .card.active { border-color:var(--gold); box-shadow:inset 0 1px 0 #fff3,0 0 18px #ffd36b88; }
  .name { font-weight:700; font-size:14px; display:flex; justify-content:space-between; letter-spacing:1px; }
  .name span:last-child { color:var(--gold); }
  .portrait { display:flex; align-items:center; gap:8px; margin:4px 0; }
  .face { width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:30px;
    background:radial-gradient(circle at 35% 30%,#6c58b0,#241a40 70%); border:2px solid var(--gold); box-shadow:0 0 10px #ffd36b55, inset 0 -4px 8px #0007; }
  .bars { flex:1; }
  .bar { height:14px; background:#0009; border-radius:7px; overflow:hidden; margin-top:4px; position:relative; border:1px solid #000a; box-shadow:inset 0 2px 3px #000a; }
  .bar > i { display:block; height:100%; transition:width .45s; border-radius:7px; position:relative; }
  .bar > i::after { content:""; position:absolute; left:3px; right:3px; top:1px; height:35%; background:#fff4; border-radius:4px; }
  .hp i { background:linear-gradient(#ff6b6b,#b3121f); }
  .xp i { background:linear-gradient(#c9a3ff,#6a35c9); }
  .xp { height:9px; }
  .small { font-family:system-ui,sans-serif; font-size:11px; color:var(--dim); margin-top:3px; }
  @keyframes hit { 0%,100%{filter:none} 30%{filter:brightness(2.2) saturate(0)} }
  .hitflash .face { animation:hit .3s; }
  #mana { display:flex; gap:6px; }
  .m { flex:1; text-align:center; border-radius:10px; padding:3px 0 0; font-size:12px; font-weight:700; background:#0007; border:1px solid #fff2; overflow:hidden; font-family:system-ui,sans-serif; }
  .m .mb { height:5px; margin-top:3px; background:currentColor; transition:width .4s; box-shadow:0 0 8px currentColor; }
  #spells { display:flex; gap:6px; flex-wrap:wrap; }
  .spell { flex:1 1 45%; background:linear-gradient(#34265a,var(--panel2)); border:2px solid var(--edge); color:var(--txt); border-radius:10px;
    padding:6px 8px; font-size:12px; cursor:pointer; text-align:left; font-family:system-ui,sans-serif; transition:transform .1s; }
  .spell b { display:block; font-size:13px; font-family:'Palatino Linotype','Book Antiqua',Georgia,serif; letter-spacing:.5px; }
  .spell:active:not([disabled]) { transform:scale(.97); }
  .spell[disabled] { opacity:.45; cursor:not-allowed; }
  @keyframes glow { 0%,100%{box-shadow:0 0 6px #7f78} 50%{box-shadow:0 0 16px #9f9c} }
  .spell.ready { border-color:#8f8; animation:glow 1.6s infinite; }
  .frame { padding:6px; border-radius:14px; background:linear-gradient(135deg,#ffe08a,#a86a14 50%,#ffd36b); box-shadow:0 6px 20px #000a; }
  canvas { width:100%; aspect-ratio:1; background:#0b0814; border:3px solid #2a1c10; border-radius:9px; touch-action:none; display:block; }
  #log { height:64px; overflow:hidden; font-family:system-ui,sans-serif; font-size:12px; color:var(--dim); background:#0006; border-radius:10px; padding:6px 8px; border:1px solid #fff1; }
  #log div:first-child { color:var(--txt); }
  #overlay { position:fixed; inset:0; background:radial-gradient(#2a1a50ee,#05020bf2); display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; text-align:center; z-index:5; padding:20px; }
  #overlay.show { display:flex; }
  #overlay h2 { font-size:44px; margin:0; letter-spacing:6px; font-weight:900; background:linear-gradient(#fff3c4,#ffb82e 55%,#b86a00); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 3px 0 #000a) drop-shadow(0 0 16px #ff9a2e88); }
  #otext { font-family:system-ui,sans-serif; color:var(--dim); max-width:360px; line-height:1.5; }
  button.big { background:linear-gradient(#ffe08a,#e0952b); color:#2a1604; border:0; border-radius:10px; padding:12px 30px; font:900 17px 'Palatino Linotype','Book Antiqua',Georgia,serif; letter-spacing:2px; cursor:pointer; box-shadow:0 4px 0 #8a4f0a,0 8px 18px #000a; }
  button.big:active { transform:translateY(3px); box-shadow:0 1px 0 #8a4f0a; }
  #topbar { position:relative; width:100%; max-width:1100px; text-align:center; }
  #tools { position:absolute; right:0; top:2px; display:flex; gap:6px; }
  #tools button { background:#2a1f45; color:var(--gold); border:2px solid var(--edge); border-radius:8px; width:36px; height:32px; font-size:16px; cursor:pointer; }
  #tools button.off { opacity:.5; }
  @media (min-width:800px) and (min-aspect-ratio:1/1) {
    #game { max-width:1100px; display:grid; grid-template-columns:auto 1fr; grid-template-rows:auto auto auto 1fr; column-gap:16px;
      grid-template-areas:"board cards" "board mana" "board spells" "board log"; align-items:start; }
    .frame { grid-area:board; width:min(calc(100vh - 80px),58vw); }
    #cards { grid-area:cards; } #mana { grid-area:mana; } #spells { grid-area:spells; } #log { grid-area:log; height:100%; min-height:64px; }
    #spells .spell { flex:1 1 100%; }
  }
  @media (max-height:480px) { #log { display:none; } h1 { font-size:18px; margin:0 0 4px; } }
</style>
</head>
<body>
<div id="topbar"><h1>GEMHOLLOW</h1><div id="tools"><button id="mute" title="Sound on/off">♪</button><button id="fs" title="Fullscreen">⛶</button></div></div>
<div id="game">
  <div class="row" id="cards">
    <div class="card" id="pcard">
      <div class="name"><span id="pname">Wanderer</span><span id="plv"></span></div>
      <div class="portrait"><div class="face">🛡️</div><div class="bars">
      <div class="bar hp"><i id="php"></i></div>
      <div class="small" id="phptxt"></div>
      <div class="bar xp"><i id="pxp"></i></div></div></div>
      <div class="small" id="pgold"></div>
    </div>
    <div class="card" id="ecard">
      <div class="name"><span id="ename"></span><span id="elv"></span></div>
      <div class="portrait"><div class="face" id="eface"></div><div class="bars">
      <div class="bar hp"><i id="ehp"></i></div>
      <div class="small" id="ehptxt"></div></div></div>
      <div class="small" id="estat"></div>
    </div>
  </div>
  <div id="mana"></div>
  <div class="frame"><canvas id="cv" width="960" height="960"></canvas></div>
  <div id="spells"></div>
  <div id="log"></div>
</div>
<div id="overlay"><h2 id="otitle"></h2><div id="otext"></div><button class="big" id="obtn">Continue</button></div>

<script>
"use strict";
const N = 8, CELL = 60;
const SKULL=0, RED=1, GREEN=2, BLUE=3, EARTH=4, STAR=5;
const GEMS = [
  {name:"Skull", emoji:"💀", col:"#5a4a6a"},
  {name:"Fire",  emoji:"🔥", col:"#d8402f"},
  {name:"Nature",emoji:"🍃", col:"#3fa34d"},
  {name:"Water", emoji:"💧", col:"#3b82d8"},
  {name:"Earth", emoji:"⛰️", col:"#d9a621"},
  {name:"Star",  emoji:"⭐", col:"#a45be0"},
];
const MANA_TYPES = [RED, GREEN, BLUE, EARTH];
const MANA_MAX = 12;

const SPELLS = [
  {name:"Fireball", cost:{[RED]:6},  desc:l=>`Deal ${8+3*l} damage`,
    run:async(g)=>{ await g.hurtEnemy(8+3*g.p.lv,"Fireball"); }},
  {name:"Heal", cost:{[GREEN]:5}, desc:l=>`Restore ${10+4*l} HP`,
    run:async(g)=>{ g.healPlayer(10+4*g.p.lv); }},
  {name:"Frost", cost:{[BLUE]:6}, desc:l=>`${3+l} dmg, enemy skips its turn`,
    run:async(g)=>{ await g.hurtEnemy(3+g.p.lv,"Frost"); g.e.frozen=true; g.log("Enemy is frozen!"); }},
  {name:"Smite", cost:{[EARTH]:6,[RED]:2}, desc:()=>`Destroy all skulls, 3 dmg each`,
    run:async(g)=>{ const cells=[]; for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(g.b[r][c]&&g.b[r][c].t===SKULL) cells.push([r,c]);
      g.afterSpellCells=cells; }},
];


// ---------- audio (synthesized, no asset files) ----------
const Snd = {
  ctx:null, master:null, sfxG:null, musG:null, muted:false, forced:false, step:0, timer:null,
  load(){ try{ this.muted=localStorage.getItem("gh_muted")==="1"; }catch(e){} },
  init(){
    try{
      if(!this.ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
        this.ctx=new AC(); this.master=this.ctx.createGain(); this.master.connect(this.ctx.destination);
        this.sfxG=this.ctx.createGain(); this.sfxG.gain.value=.5; this.sfxG.connect(this.master);
        this.musG=this.ctx.createGain(); this.musG.gain.value=.16; this.musG.connect(this.master);
        this.apply(); this.timer=setInterval(()=>this.tick(),240); }
      if(this.ctx.state==="suspended") this.ctx.resume();
    }catch(e){}
  },
  apply(){ if(this.master) this.master.gain.value=(this.muted||this.forced)?0:1; },
  setMuted(m){ this.muted=m; try{ localStorage.setItem("gh_muted",m?"1":"0"); }catch(e){} this.apply(); },
  force(f){ this.forced=f; this.apply(); },
  tone(f,d,type="sine",v=.3,when=0,to=null,dest=null){
    if(!this.ctx) return; const t=this.ctx.currentTime+when, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.01); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(dest||this.sfxG); o.start(t); o.stop(t+d+.05);
  },
  noise(d,v=.3,f=1200){
    if(!this.ctx) return; const t=this.ctx.currentTime, n=Math.floor(this.ctx.sampleRate*d), buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate), a=buf.getChannelData(0);
    for(let i=0;i<n;i++) a[i]=(Math.random()*2-1)*(1-i/n);
    const s=this.ctx.createBufferSource(), fl=this.ctx.createBiquadFilter(), g=this.ctx.createGain();
    s.buffer=buf; fl.type="lowpass"; fl.frequency.value=f; g.gain.value=v; s.connect(fl); fl.connect(g); g.connect(this.sfxG); s.start(t);
  },
  play(name,n=1){
    if(!this.ctx||this.muted||this.forced) return;
    switch(name){
      case "swap": this.tone(380,.08,"triangle",.25,0,520); break;
      case "bad": this.tone(200,.15,"square",.15,0,120); break;
      case "match": { const base=[392,440,494,523,587,659,698][Math.min(n-1,6)]; this.tone(base,.18,"triangle",.3); this.tone(base*1.5,.18,"sine",.15,.06); break; }
      case "hit": this.noise(.18,.5,900); this.tone(160,.15,"sawtooth",.3,0,60); break;
      case "hurt": this.noise(.25,.6,500); this.tone(110,.25,"square",.25,0,50); break;
      case "heal": [523,659,784].forEach((f,i)=>this.tone(f,.25,"sine",.25,i*.07)); break;
      case "spell": this.tone(300,.4,"sawtooth",.18,0,900); this.tone(600,.4,"sine",.2,.05,1400); break;
      case "level": [523,659,784,1046].forEach((f,i)=>this.tone(f,.3,"triangle",.3,i*.1)); break;
      case "win": [523,659,784,659,784,1046].forEach((f,i)=>this.tone(f,.3,"triangle",.3,i*.12)); break;
      case "lose": [330,294,262,196].forEach((f,i)=>this.tone(f,.45,"sawtooth",.2,i*.25)); break;
      case "click": this.tone(600,.05,"square",.12); break;
    }
  },
  tick(){ // gentle looping arpeggio, Am F C G
    if(!this.ctx||this.muted||this.forced) return;
    const chords=[[220,261.6,329.6],[174.6,220,261.6],[261.6,329.6,392],[196,246.9,293.7]];
    const ch=chords[Math.floor(this.step/8)%4], i=this.step%8;
    this.tone(ch[[0,1,2,1,0,2,1,2][i]]*(i%4===0?1:2),.4,"triangle",.5,0,null,this.musG);
    if(i===0) this.tone(ch[0]/2,1.6,"sine",.6,0,null,this.musG);
    this.step++;
  }
};
Snd.load();
document.addEventListener("pointerdown",()=>Snd.init());
document.addEventListener("keydown",()=>Snd.init());
document.addEventListener("visibilitychange",()=>{ if(Snd.ctx) document.hidden?Snd.ctx.suspend():Snd.ctx.resume(); });

// ---------- CrazyGames SDK wrapper (safe when SDK is absent) ----------
const CG = {
  ready:false, playing:false,
  sdk(){ return window.CrazyGames&&window.CrazyGames.SDK; },
  async init(){ try{ const k=this.sdk(); if(!k) return; await k.init(); this.ready=true; try{ k.game.loadingStart(); }catch(e){} }catch(e){} },
  loaded(){ try{ if(this.ready) this.sdk().game.loadingStop(); }catch(e){} },
  start(){ if(this.playing) return; this.playing=true; try{ if(this.ready) this.sdk().game.gameplayStart(); }catch(e){} },
  stop(){ if(!this.playing) return; this.playing=false; try{ if(this.ready) this.sdk().game.gameplayStop(); }catch(e){} },
  ad(done){
    let called=false; const fin=()=>{ if(called) return; called=true; Snd.force(false); done(); };
    if(!this.ready) return fin();
    try{ this.sdk().ad.requestAd("midgame",{ adStarted:()=>Snd.force(true), adFinished:fin, adError:fin }); setTimeout(fin,60000); }catch(e){ fin(); }
  }
};

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const frame = () => new Promise(r=>requestAnimationFrame(r));
const rnd = n => Math.floor(Math.random()*n);

const ENEMIES = [
  {name:"Goblin",   face:"👺", hp:30, atk:1},
  {name:"Wolf",     face:"🐺", hp:40, atk:1},
  {name:"Bandit",   face:"🥷", hp:50, atk:3},
  {name:"Orc",      face:"👹", hp:65, atk:3},
  {name:"Skeleton", face:"💀", hp:75, atk:4},
  {name:"Troll",    face:"🧌", hp:95, atk:4},
  {name:"Wraith",   face:"👻", hp:110,atk:5},
  {name:"Dragon",   face:"🐉", hp:150,atk:6},
];

class Game {
  constructor() {
    this.p = {lv:1, xp:0, hp:40, max:40, gold:0, mana:{[RED]:0,[GREEN]:0,[BLUE]:0,[EARTH]:0}};
    this.stage = 0; this.busy = true; this.turn = "player"; this.over = false;
    this.floats = []; this.parts = []; this.shakeT = 0; this.lastAct = 0; this.sel = null; this.hint = null;
    this.newEnemy(); this.newBoard(); this.buildUI(); this.updateUI();
    this.log("A wild "+this.e.name+" appears! Match 3+ gems. Skulls hurt!");
    this.busy = false;
    requestAnimationFrame(t=>this.loop(t));
  }
  newEnemy() {
    const t = ENEMIES[this.stage % ENEMIES.length], loop = Math.floor(this.stage/ENEMIES.length);
    const s = 1 + loop*0.8;
    this.e = {name:t.name, face:t.face, lv:this.stage+1, max:Math.round(t.hp*s), hp:Math.round(t.hp*s), atk:t.atk+loop*2, frozen:false};
  }
  // ---------- board ----------
  mk(r,c,t){ return {t: t===undefined?this.rndType():t, x:c, y:r, tx:c, ty:r, s:1, dying:false}; }
  rndType(){ const w=[3,2,2,2,2,1.4], sum=w.reduce((a,b)=>a+b); let x=Math.random()*sum;
    for(let i=0;i<w.length;i++){ if((x-=w[i])<0) return i; } return 0; }
  newBoard() {
    do {
      this.b = Array.from({length:N},(_,r)=>Array.from({length:N},(_,c)=>this.mk(r,c)));
    } while (this.findMatches().cells.length || !this.bestMove());
  }
  findMatches() {
    const set = new Map(), runs = [];
    const add = (cells)=>{ runs.push(cells); cells.forEach(([r,c])=>set.set(r*N+c,[r,c])); };
    for (let r=0;r<N;r++) for (let c=0;c<N;) {
      const g=this.b[r][c]; let k=c+1;
      while (g && k<N && this.b[r][k] && this.b[r][k].t===g.t) k++;
      if (g && k-c>=3) add(Array.from({length:k-c},(_,i)=>[r,c+i]));
      c=k;
    }
    for (let c=0;c<N;c++) for (let r=0;r<N;) {
      const g=this.b[r][c]; let k=r+1;
      while (g && k<N && this.b[k][c] && this.b[k][c].t===g.t) k++;
      if (g && k-r>=3) add(Array.from({length:k-r},(_,i)=>[r+i,c]));
      r=k;
    }
    return {cells:[...set.values()], runs};
  }
  swapData(a,b){ const t=this.b[a[0]][a[1]]; this.b[a[0]][a[1]]=this.b[b[0]][b[1]]; this.b[b[0]][b[1]]=t; }
  fixTargets(){ for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const g=this.b[r][c]; if(g){g.tx=c;g.ty=r;} } }
  moves() {
    const out=[];
    for (let r=0;r<N;r++) for (let c=0;c<N;c++) for (const [dr,dc] of [[0,1],[1,0]]) {
      const r2=r+dr,c2=c+dc; if(r2>=N||c2>=N) continue;
      this.swapData([r,c],[r2,c2]);
      const m=this.findMatches(); this.swapData([r,c],[r2,c2]);
      if (m.cells.length) out.push({a:[r,c],b:[r2,c2],m});
    }
    return out;
  }
  bestMove(){
    const ms=this.moves(); if(!ms.length) return null;
    return ms;
  }
  async settle(){
    for(let i=0;i<300;i++){
      let moving=false;
      for(const row of this.b) for(const g of row) if(g){
        const dx=g.tx-g.x, dy=g.ty-g.y;
        if (Math.abs(dx)>0.01||Math.abs(dy)>0.01){ moving=true;
          g.x += Math.sign(dx)*Math.min(Math.abs(dx), Math.max(0.12,Math.abs(dx)*0.3));
          g.y += Math.sign(dy)*Math.min(Math.abs(dy), Math.max(0.15,Math.abs(dy)*0.3));
        } else { g.x=g.tx; g.y=g.ty; }
      }
      if(!moving) return;
      await frame();
    }
  }
  async trySwap(a,b,who){
    Snd.play("swap"); this.swapData(a,b); this.fixTargets(); await this.settle();
    const m=this.findMatches();
    if(!m.cells.length){ Snd.play("bad"); this.swapData(a,b); this.fixTargets(); await this.settle(); return false; }
    return true;
  }
  // resolve cascades; returns true if extra turn earned
  async resolve(who, forced) {
    let extra=false, chain=0;
    while(true){
      let m;
      if (forced) { m={cells:forced, runs:[]}; forced=null; }
      else m=this.findMatches();
      if(!m.cells.length) break;
      chain++; Snd.play("match",chain);
      if (m.runs.some(r=>r.length>=4)) extra=true;
      if (m.runs.some(r=>r.length>=5)) extra=true;
      const cnt={}; for(const [r,c] of m.cells){ const g=this.b[r][c]; cnt[g.t]=(cnt[g.t]||0)+1; g.dying=true; this.burst(c*60+30,r*60+30,GEMS[g.t].col); }
      const bonus = chain>1 ? 1+0.25*(chain-1) : 1;
      if(chain>1) this.floatText(240,30,`Cascade x${chain}!`,"#ffd36b");
      // effects
      const cx=m.cells.reduce((s,[r,c])=>s+c,0)/m.cells.length*CELL+30, cy=m.cells.reduce((s,[r,c])=>s+r,0)/m.cells.length*CELL+30;
      for(const t in cnt){ const n=cnt[t], ti=+t;
        if(ti===SKULL){
          const dmg=Math.round(n*(who==="player"?(1+Math.ceil(this.p.lv/2)):this.e.atk)*bonus);
          if(who==="player") await this.hurtEnemy(dmg,null,cx,cy); else await this.hurtPlayer(dmg,cx,cy);
        } else if(who==="player"){
          if(MANA_TYPES.includes(ti)){ this.p.mana[ti]=Math.min(MANA_MAX,this.p.mana[ti]+Math.round(n*bonus)); this.floatText(cx,cy,`+${n} ${GEMS[ti].name}`,GEMS[ti].col); }
          else if(ti===STAR){ const x=n*3; this.floatText(cx,cy,`+${x} XP`,"#c9f"); await this.addXp(x); }
        }
      }
      if(who==="player" && cnt[EARTH]) { const g=cnt[EARTH]*5; this.p.gold+=g; }
      this.updateUI();
      await sleep(40);
      for(let i=0;i<8;i++){ for(const [r,c] of m.cells) this.b[r][c].s*=0.7; await frame(); }
      for(const [r,c] of m.cells) this.b[r][c]=null;
      if(this.over||this.e.hp<=0||this.p.hp<=0) { return extra; }
      this.gravity();
      await this.settle();
    }
    return extra;
  }
  gravity(){
    for(let c=0;c<N;c++){
      let w=N-1;
      for(let r=N-1;r>=0;r--) if(this.b[r][c]){ this.b[w][c]=this.b[r][c]; if(w!==r) this.b[r][c]=null; w--; }
      let k=0;
      for(let r=w;r>=0;r--){ k++; this.b[r][c]=this.mk(r,c); this.b[r][c].y=-k; }
    }
    this.fixTargets();
  }
  async ensureMoves(){
    if(this.moves().length) return;
    this.log("No moves left — reshuffling!");
    do { for(let r=0;r<N;r++)for(let c=0;c<N;c++){ this.b[r][c]=this.mk(r,c); this.b[r][c].y=r-N; } }
    while(this.findMatches().cells.length || !this.moves().length);
    await this.settle();
  }
  // ---------- combat ----------
  async hurtEnemy(d,label,x=240,y=60){ Snd.play("hit"); this.e.hp=Math.max(0,this.e.hp-d); this.floatText(x,y,"-"+d,"#ff7b6b"); this.shake("ecard"); this.updateUI(); await sleep(150); }
  async hurtPlayer(d,x=240,y=420){ Snd.play("hurt"); this.p.hp=Math.max(0,this.p.hp-d); this.floatText(x,y,"-"+d,"#ff4d4d"); this.shake("pcard"); this.updateUI(); await sleep(150); }
  healPlayer(h){ Snd.play("heal"); const a=Math.min(h,this.p.max-this.p.hp); this.p.hp+=a; this.floatText(240,240,"+"+a+" HP","#6f6"); this.updateUI(); }
  async addXp(x){
    this.p.xp+=x;
    while(this.p.xp>=this.need()){ this.p.xp-=this.need(); this.p.lv++; this.p.max+=10; this.p.hp=this.p.max; Snd.play("level");
      this.log(`LEVEL UP! You are now level ${this.p.lv}. HP restored.`); this.floatText(240,240,"LEVEL UP!","#ffd36b"); }
    this.updateUI();
  }
  need(){ return 30+(this.p.lv-1)*20; }
  checkEnd(){
    if(this.e.hp<=0){ this.winBattle(); return true; }
    if(this.p.hp<=0){ this.lose(); return true; }
    return false;
  }
  async winBattle(){
    this.over=true; CG.stop(); Snd.play("win");
    const xp=15+this.e.lv*8, gold=10+this.e.lv*10;
    this.p.gold+=gold; await this.addXp(xp);
    this.stage++;
    this.show("Victory!",`${this.e.name} defeated.\n+${xp} XP, +${gold} gold`,"Next Battle",()=>CG.ad(()=>{
      CG.start(); this.newEnemy(); this.newBoard(); this.over=false; this.turn="player"; this.updateUI(); this.log("A wild "+this.e.name+" appears!"); this.busy=false; }));
  }
  lose(){ this.over=true; CG.stop(); Snd.play("lose"); this.show("Defeated",`You fell to the ${this.e.name} after ${this.stage} victories.\nGold: ${this.p.gold}`,"Try Again",()=>CG.ad(()=>location.reload())); }
  async playerMove(a,b){
    if(this.busy||this.over||this.turn!=="player") return;
    this.busy=true; this.sel=null; this.hint=null;
    if(!(await this.trySwap(a,b,"player"))){ this.busy=false; return; }
    const extra=await this.resolve("player");
    await this.afterAction(extra);
  }
  async afterAction(extra){
    if(this.checkEnd()) return;
    await this.ensureMoves();
    if(extra && this.turn==="player"){ this.log("Extra turn!"); this.busy=false; this.updateUI(); return; }
    if(this.turn==="player") await this.enemyTurn(); else { this.turn="player"; this.busy=false; this.updateUI(); }
  }
  async enemyTurn(){
    this.turn="enemy"; this.updateUI();
    if(this.e.frozen){ this.e.frozen=false; this.log(this.e.name+" is frozen and skips its turn."); await sleep(600); this.turn="player"; this.busy=false; this.updateUI(); return; }
    await sleep(500);
    while(true){
      const ms=this.moves(); if(!ms.length) break;
      const score=m=>m.m.cells.filter(([r,c])=>this.b[r][c].t===SKULL).length*3 + Math.max(...m.m.runs.map(x=>x.length))*2 + Math.random()*2;
      ms.sort((x,y)=>score(y)-score(x));
      const pick = Math.random()<0.4 ? ms[rnd(ms.length)] : ms[0];
      this.sel=pick.a; await sleep(350); this.sel=pick.b; await sleep(250); this.sel=null;
      this.swapData(pick.a,pick.b); this.fixTargets(); await this.settle();
      const extra=await this.resolve("enemy");
      if(this.checkEnd()) return;
      await this.ensureMoves();
      if(!(extra && Math.random()<0.7)) break;
      this.log(this.e.name+" gets an extra turn!");
    }
    this.turn="player"; this.busy=false; this.updateUI();
  }
  async cast(i){
    const s=SPELLS[i];
    if(this.busy||this.over||this.turn!=="player") return;
    for(const t in s.cost) if(this.p.mana[t]<s.cost[t]) return;
    this.busy=true;
    for(const t in s.cost) this.p.mana[t]-=s.cost[t];
    this.log("You cast "+s.name+"!"); Snd.play("spell");
    this.afterSpellCells=null;
    await s.run(this); this.updateUI();
    if(this.afterSpellCells){
      const cells=this.afterSpellCells; this.afterSpellCells=null;
      if(cells.length){ await this.hurtEnemy(cells.length*3,"Smite"); if(!this.checkEnd()){ await this.resolve("player",cells); } }
    }
    if(this.checkEnd()) return;
    await this.ensureMoves();
    this.busy=false; this.updateUI();  // spells don't end turn
  }
  // ---------- UI ----------
  buildUI(){
    $("mana").innerHTML=MANA_TYPES.map(t=>`<div class="m" id="m${t}" style="color:${GEMS[t].col}">${GEMS[t].emoji} <span></span><div class="mb" id="mb${t}"></div></div>`).join("");
    $("spells").innerHTML=SPELLS.map((s,i)=>{
      const cost=Object.entries(s.cost).map(([t,n])=>n+GEMS[t].emoji).join(" ");
      return `<button class="spell" id="sp${i}"><b>${s.name} — ${cost}</b><span id="sd${i}"></span></button>`;}).join("");
    SPELLS.forEach((_,i)=>$("sp"+i).onclick=()=>this.cast(i));
  }
  updateUI(){
    const p=this.p,e=this.e; this.lastAct=performance.now(); this.hint=null;
    $("plv").textContent="Lv "+p.lv; $("elv").textContent="Lv "+e.lv;
    $("php").style.width=100*p.hp/p.max+"%"; $("phptxt").textContent=`HP ${p.hp}/${p.max}`;
    $("pxp").style.width=100*p.xp/this.need()+"%"; $("pgold").textContent=`XP ${p.xp}/${this.need()}  ·  🪙 ${p.gold}`;
    $("ename").textContent=e.name; $("eface").textContent=e.face;
    $("ehp").style.width=100*e.hp/e.max+"%"; $("ehptxt").textContent=`HP ${e.hp}/${e.max}`;
    $("estat").textContent=`Attack ${e.atk}`+(e.frozen?" · ❄ frozen":"");
    $("pcard").classList.toggle("active",this.turn==="player"); $("ecard").classList.toggle("active",this.turn==="enemy");
    for(const t of MANA_TYPES) { $("m"+t).querySelector("span").textContent=p.mana[t]+"/"+MANA_MAX; $("mb"+t).style.width=100*p.mana[t]/MANA_MAX+"%"; }
    SPELLS.forEach((s,i)=>{
      const ok=Object.keys(s.cost).every(t=>p.mana[t]>=s.cost[t]);
      const b=$("sp"+i); b.disabled=!ok||this.busy||this.turn!=="player"; b.classList.toggle("ready",ok);
      $("sd"+i).textContent=s.desc(p.lv);
    });
  }
  log(t){ const d=$("log"); d.innerHTML=`<div>${t}</div>`+d.innerHTML; while(d.children.length>5) d.lastChild.remove(); }
  shake(id){ const el=$(id); el.animate([{transform:"translateX(0)"},{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(0)"}],{duration:250});
    el.classList.remove("hitflash"); void el.offsetWidth; el.classList.add("hitflash"); this.shakeT=id==="pcard"?12:8; }
  floatText(x,y,text,color){ this.floats.push({x,y,text,color,life:60}); }
  show(title,text,btn,cb){
    $("otitle").textContent=title; $("otext").style.whiteSpace="pre-line"; $("otext").textContent=text; $("obtn").textContent=btn;
    $("overlay").classList.add("show"); $("obtn").onclick=()=>{ $("overlay").classList.remove("show"); cb(); };
  }
  // ---------- render ----------
  burst(x,y,col,n=10){ for(let i=0;i<n;i++){ const a=Math.random()*6.283,v=1.5+Math.random()*4;
    this.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.5,life:30+Math.random()*20,max:50,col,r:2+Math.random()*3}); } }
  gemPath(t,cx,cy,r){
    const poly=(n,rot,rr=r)=>{ for(let i=0;i<n;i++){ const a=rot+i*6.2832/n; ctx[i?"lineTo":"moveTo"](cx+Math.cos(a)*rr,cy+Math.sin(a)*rr); } ctx.closePath(); };
    ctx.beginPath();
    if(t===SKULL) ctx.roundRect(cx-r*.85,cy-r*.85,r*1.7,r*1.7,r*.4);
    else if(t===RED) { ctx.moveTo(cx,cy-r*1.05); ctx.lineTo(cx+r*.9,cy); ctx.lineTo(cx,cy+r*1.05); ctx.lineTo(cx-r*.9,cy); ctx.closePath(); }
    else if(t===GREEN) poly(6,0);
    else if(t===BLUE) ctx.arc(cx,cy,r,0,6.2832);
    else if(t===EARTH) poly(8,Math.PI/8);
    else { for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*.62:r*1.08; ctx[i?"lineTo":"moveTo"](cx+Math.cos(a)*rr,cy+Math.sin(a)*rr); } ctx.closePath(); }
  }
  drawIcon(t,cx,cy,r){
    const P=(pts)=>{ ctx.beginPath(); ctx.moveTo(cx+pts[0]*r,cy+pts[1]*r);
      for(let i=2;i<pts.length;i+=6) ctx.bezierCurveTo(cx+pts[i]*r,cy+pts[i+1]*r,cx+pts[i+2]*r,cy+pts[i+3]*r,cx+pts[i+4]*r,cy+pts[i+5]*r); };
    const L=(pts)=>{ ctx.beginPath(); pts.forEach((v,i)=>{ if(i%2===0) ctx[i?"lineTo":"moveTo"](cx+v*r,cy+pts[i+1]*r); }); ctx.closePath(); };
    r*=.72; ctx.save(); ctx.globalAlpha=.78; ctx.lineJoin="round"; ctx.lineCap="round"; ctx.lineWidth=Math.max(1.2,r*.07);
    const draw=(fill,stroke)=>{ ctx.fillStyle=fill; ctx.strokeStyle=stroke; ctx.fill(); ctx.stroke(); };
    if(t===RED){
      P([0,.52, -.46,.52,-.52,.05,-.26,-.2, -.22,-.05,-.1,0,-.04,-.1, -.1,-.35,.06,-.45,.1,-.62, .46,-.3,.5,.52,0,.52]); draw("#ffd9a0","#6a1a10");
      P([0,.4, -.2,.4,-.22,.15,-.08,.02, 0,.1,.06,.1,.1,.02, .24,.15,.2,.4,0,.4]); draw("#ff9a2e","#a83010");
    } else if(t===GREEN){
      P([-.48,.46, -.55,-.3,.1,-.58,.52,-.52, .52,-.1,.3,.52,-.48,.46]); draw("#d6f0c0","#1d4a22");
      ctx.beginPath(); ctx.moveTo(cx-.5*r,cy+.5*r); ctx.lineTo(cx+.22*r,cy-.22*r); ctx.strokeStyle="#2f8a3a"; ctx.stroke();
    } else if(t===BLUE){
      P([0,-.58, .12,-.3,.42,-.05,.42,.2, .42,.5,-.42,.5,-.42,.2, -.42,-.05,-.12,-.3,0,-.58]); draw("#cfe6fa","#143a70");
      ctx.beginPath(); ctx.moveTo(cx-.22*r,cy+.12*r); ctx.quadraticCurveTo(cx-.22*r,cy+.32*r,cx-.05*r,cy+.36*r); ctx.strokeStyle="#4a9be8"; ctx.stroke();
    } else if(t===EARTH){
      L([-.58,.42, -.16,-.34, .04,-.04, .2,-.22, .58,.42]); draw("#f3dfae","#4a3000");
      ctx.beginPath(); ctx.moveTo(cx-.16*r,cy-.34*r); ctx.lineTo(cx-.02*r,cy+.42*r); ctx.moveTo(cx+.2*r,cy-.22*r); ctx.lineTo(cx+.12*r,cy+.42*r);
      ctx.strokeStyle="#b07a1a"; ctx.lineWidth=Math.max(1,r*.05); ctx.stroke();
    } else {
      L([0,-.5, .12,-.12, .5,0, .12,.12, 0,.5, -.12,.12, -.5,0, -.12,-.12]); draw("#efe0ff","#4a2380");
    }
    ctx.restore();
  }
  drawSkull(cx,cy,r){
    ctx.save(); ctx.lineJoin="round"; ctx.lineWidth=Math.max(1.5,r*.07); ctx.strokeStyle="#1a1020";
    const bone=ctx.createLinearGradient(cx,cy-r*.7,cx,cy+r*.6); bone.addColorStop(0,"#ffffff"); bone.addColorStop(1,"#cfc6b4");
    ctx.fillStyle=bone;
    // jaw
    ctx.beginPath(); ctx.roundRect(cx-r*.34,cy+r*.18,r*.68,r*.42,r*.12); ctx.fill(); ctx.stroke();
    // cranium
    ctx.beginPath(); ctx.ellipse(cx,cy-r*.12,r*.62,r*.54,0,0,6.2832); ctx.fill(); ctx.stroke();
    // eye sockets
    ctx.fillStyle="#1a1020";
    for(const d of [-1,1]){ ctx.beginPath(); ctx.ellipse(cx+d*r*.26,cy-r*.1,r*.17,r*.2,d*.15,0,6.2832); ctx.fill();
      ctx.fillStyle="#ff4a3a"; ctx.beginPath(); ctx.arc(cx+d*r*.26,cy-r*.07,r*.05,0,6.2832); ctx.fill(); ctx.fillStyle="#1a1020"; }
    // nose
    ctx.beginPath(); ctx.moveTo(cx,cy+r*.06); ctx.lineTo(cx-r*.08,cy+r*.22); ctx.lineTo(cx+r*.08,cy+r*.22); ctx.closePath(); ctx.fill();
    // teeth
    ctx.lineWidth=Math.max(1,r*.05);
    ctx.beginPath(); for(const k of [-.17,0,.17]){ ctx.moveTo(cx+r*k,cy+r*.3); ctx.lineTo(cx+r*k,cy+r*.58); } ctx.stroke();
    ctx.restore();
  }
  drawGem(g,S,t){
    const cx=g.x*S+S/2, cy=g.y*S+S/2; let r=S*0.4*g.s; if(r<1) return;
    const sel=this.sel&&this.sel[0]===g.ty&&this.sel[1]===g.tx;
    const hint=this.hint&&this.hint.some(([hr,hc])=>hr===g.ty&&hc===g.tx);
    if(sel) r*=1+0.05*Math.sin(t/90)+0.08;
    if(hint) r*=1+0.08*Math.sin(t/140);
    const col=GEMS[g.t].col;
    ctx.save();
    ctx.shadowColor=col; ctx.shadowBlur=(sel||hint)?18:6;
    this.gemPath(g.t,cx,cy,r);
    const gr=ctx.createRadialGradient(cx-r*.35,cy-r*.45,r*.1,cx,cy,r*1.15);
    gr.addColorStop(0,shade(col,70)); gr.addColorStop(.45,col); gr.addColorStop(1,shade(col,-60));
    ctx.fillStyle=gr; ctx.fill();
    ctx.shadowBlur=0; ctx.lineWidth=2.5; ctx.strokeStyle=shade(col,-75); ctx.stroke();
    ctx.lineWidth=1.2; ctx.strokeStyle="#fff6"; this.gemPath(g.t,cx,cy,r*.82); ctx.stroke();
    ctx.restore();
    // specular highlight
    ctx.fillStyle="#ffffff55"; ctx.beginPath(); ctx.ellipse(cx-r*.3,cy-r*.45,r*.32,r*.16,-0.6,0,6.2832); ctx.fill();
    if(g.t===SKULL) this.drawSkull(cx,cy,r);
    else this.drawIcon(g.t,cx,cy,r);
    if(sel){ ctx.lineWidth=3; ctx.strokeStyle="#ffd36b"; ctx.shadowColor="#ffd36b"; ctx.shadowBlur=12; this.gemPath(g.t,cx,cy,r*1.15); ctx.stroke(); ctx.shadowBlur=0; }
  }
  loop(t=0){
    const S=480/N;
    ctx.setTransform(2,0,0,2,0,0); ctx.clearRect(0,0,480,480);
    if(this.shakeT>0){ this.shakeT*=0.88; if(this.shakeT<0.3) this.shakeT=0; ctx.translate((Math.random()-.5)*this.shakeT,(Math.random()-.5)*this.shakeT); }
    const bg=ctx.createLinearGradient(0,0,0,480); bg.addColorStop(0,"#241942"); bg.addColorStop(1,"#120b22");
    ctx.fillStyle=bg; ctx.fillRect(-20,-20,520,520);
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){ ctx.fillStyle=(r+c)%2?"#ffffff08":"#00000030"; ctx.fillRect(c*S,r*S,S,S);
      ctx.strokeStyle="#ffffff0d"; ctx.lineWidth=1; ctx.strokeRect(c*S+.5,r*S+.5,S-1,S-1); }
    // idle hint
    if(this.turn==="player"&&!this.busy&&!this.over){
      if(!this.hint&&t-this.lastAct>6000){ const m=this.moves(); if(m.length) this.hint=[m[0].a,m[0].b]; }
    } else this.hint=null;
    for(const row of this.b) for(const g of row) if(g) this.drawGem(g,S,t);
    // particles
    this.parts=this.parts.filter(p=>--p.life>0);
    for(const p of this.parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; ctx.globalAlpha=Math.min(1,p.life/p.max*1.5);
      ctx.fillStyle=p.col; ctx.shadowColor=p.col; ctx.shadowBlur=8; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life/p.max+.5,0,6.2832); ctx.fill(); }
    ctx.shadowBlur=0; ctx.globalAlpha=1;
    // vignette
    const v=ctx.createRadialGradient(240,240,200,240,240,360); v.addColorStop(0,"#0000"); v.addColorStop(1,"#000a");
    ctx.fillStyle=v; ctx.fillRect(-20,-20,520,520);
    ctx.font="900 24px 'Palatino Linotype',Georgia,serif"; ctx.textAlign="center"; ctx.textBaseline="alphabetic";
    this.floats=this.floats.filter(f=>--f.life>0);
    for(const f of this.floats){ ctx.globalAlpha=Math.min(1,f.life/20); ctx.fillStyle=f.color; ctx.strokeStyle="#000"; ctx.lineWidth=5; ctx.lineJoin="round";
      const y=f.y-(60-f.life)*0.8, sc=1+Math.max(0,(f.life-52))*0.05; ctx.save(); ctx.translate(f.x,y); ctx.scale(sc,sc);
      ctx.strokeText(f.text,0,0); ctx.fillText(f.text,0,0); ctx.restore(); }
    ctx.globalAlpha=1;
    requestAnimationFrame(tt=>this.loop(tt));
  }
}

function shade(hex,amt){
  const n=parseInt(hex.slice(1),16); const f=v=>Math.max(0,Math.min(255,v+amt));
  return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`;
}

const game = new Game();
game.show("GEMHOLLOW","Shards of the Ember Crown\n\nMatch gems, smash skulls, and channel mana to slay the denizens of the hollow.","Begin Quest",()=>{ Snd.init(); Snd.play("click"); CG.start(); });
CG.init().then(()=>CG.loaded());

// ---------- toolbar ----------
const muteBtn=document.getElementById("mute"), syncMute=()=>muteBtn.classList.toggle("off",Snd.muted);
muteBtn.onclick=()=>{ Snd.init(); Snd.setMuted(!Snd.muted); syncMute(); }; syncMute();
document.getElementById("fs").onclick=()=>{ const d=document.documentElement;
  try{ document.fullscreenElement?document.exitFullscreen():(d.requestFullscreen||d.webkitRequestFullscreen).call(d); }catch(e){} };

// ---------- input ----------
let down=null;
const cellAt=e=>{ const R=cv.getBoundingClientRect(); const c=Math.floor((e.clientX-R.left)/R.width*N), r=Math.floor((e.clientY-R.top)/R.height*N);
  return (r>=0&&r<N&&c>=0&&c<N)?[r,c]:null; };
const adj=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])===1;
cv.addEventListener("pointerdown",e=>{
  if(game.busy||game.over||game.turn!=="player") return;
  const cell=cellAt(e); if(!cell) return;
  if(game.sel && adj(game.sel,cell)){ const a=game.sel; game.playerMove(a,cell); down=null; return; }
  game.sel=cell; down={cell,x:e.clientX,y:e.clientY};
});
cv.addEventListener("pointermove",e=>{
  if(!down||game.busy) return;
  const dx=e.clientX-down.x, dy=e.clientY-down.y;
  if(Math.hypot(dx,dy)<20) return;
  const [r,c]=down.cell; const t=Math.abs(dx)>Math.abs(dy)?[r,c+Math.sign(dx)]:[r+Math.sign(dy),c];
  down=null;
  if(t[0]>=0&&t[0]<N&&t[1]>=0&&t[1]<N) game.playerMove([r,c],t);
});
window.addEventListener("pointerup",()=>{ down=null; });
</script>
</body>
