ls</b> damage the foe. <b>Fire, Air, Water, Earth</b> gems fill mana for spells. <b>Stars</b> give XP. Earth gems also drop coins.","Las <b>calaveras</b> da\xF1an al enemigo. Las gemas de <b>Fuego, Aire, Agua y Tierra</b> llenan el man\xE1 de los hechizos. Las <b>estrellas</b> dan XP. Las gemas de Tierra tambi\xE9n sueltan monedas.","<b>Caveiras</b> ferem o inimigo. Gemas de <b>Fogo, Ar, \xC1gua e Terra</b> enchem a mana dos feiti\xE7os. <b>Estrelas</b> d\xE3o XP. Gemas de Terra tamb\xE9m soltam moedas.","Les <b>cr\xE2nes</b> blessent l'ennemi. Les gemmes de <b>Feu, d'Air, d'Eau et de Terre</b> remplissent le mana des sorts. Les <b>\xE9toiles</b> donnent de l'XP. Les gemmes de Terre rapportent aussi des pi\xE8ces.","<b>Totenk\xF6pfe</b> verletzen den Gegner. <b>Feuer-, Luft-, Wasser- und Erdsteine</b> f\xFCllen Mana f\xFCr Zauber. <b>Sterne</b> geben EP. Erdsteine bringen auch M\xFCnzen.","<b>\u0427\u0435\u0440\u0435\u043F\u0430</b> \u0440\u0430\u043D\u044F\u0442 \u0432\u0440\u0430\u0433\u0430. \u041A\u0430\u043C\u043D\u0438 <b>\u041E\u0433\u043D\u044F, \u0412\u043E\u0437\u0434\u0443\u0445\u0430, \u0412\u043E\u0434\u044B \u0438 \u0417\u0435\u043C\u043B\u0438</b> \u043D\u0430\u043F\u043E\u043B\u043D\u044F\u044E\u0442 \u043C\u0430\u043D\u0443 \u0434\u043B\u044F \u0437\u0430\u043A\u043B\u0438\u043D\u0430\u043D\u0438\u0439. <b>\u0417\u0432\u0451\u0437\u0434\u044B</b> \u0434\u0430\u044E\u0442 \u043E\u043F\u044B\u0442. \u041A\u0430\u043C\u043D\u0438 \u0417\u0435\u043C\u043B\u0438 \u0442\u0430\u043A\u0436\u0435 \u043F\u0440\u0438\u043D\u043E\u0441\u044F\u0442 \u043C\u043E\u043D\u0435\u0442\u044B."],["Matching <b>4+</b> in a line, or <b>5+ in an L, T or + shape</b>, gives an <b>extra turn</b>; cascades hit harder.","Combinar <b>4+</b> en l\xEDnea, o <b>5+ en forma de L, T o +</b>, da un <b>turno extra</b>; las cascadas pegan m\xE1s fuerte.","Combinar <b>4+</b> em linha, ou <b>5+ em forma de L, T ou +</b>, d\xE1 um <b>turno extra</b>; cascatas causam mais dano.","Aligner <b>
