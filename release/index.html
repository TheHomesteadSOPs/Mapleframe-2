chwer","\u0421\u043B\u043E\u0436\u043D\u043E"],["Swap two neighboring gems to line up <b>3 or more</b>. Then the enemy takes its turn on the same board.","Intercambia dos gemas vecinas para alinear <b>3 o m\xE1s</b>. Luego el enemigo juega su turno en el mismo tablero.","Troque duas gemas vizinhas para alinhar <b>3 ou mais</b>. Depois o inimigo joga no mesmo tabuleiro.","\xC9changez deux gemmes voisines pour aligner <b>3 ou plus</b>. L'ennemi joue ensuite sur le m\xEAme plateau.","Tausche zwei benachbarte Steine, um <b>3 oder mehr</b> in eine Reihe zu bringen. Danach ist der Gegner auf demselben Brett dran.","\u041F\u043E\u043C\u0435\u043D\u044F\u0439\u0442\u0435 \u0434\u0432\u0430 \u0441\u043E\u0441\u0435\u0434\u043D\u0438\u0445 \u043A\u0430\u043C\u043D\u044F, \u0447\u0442\u043E\u0431\u044B \u0441\u043E\u0431\u0440\u0430\u0442\u044C <b>3 \u0438 \u0431\u043E\u043B\u0435\u0435</b>. \u0417\u0430\u0442\u0435\u043C \u0432\u0440\u0430\u0433 \u0445\u043E\u0434\u0438\u0442 \u043D\u0430 \u0442\u043E\u043C \u0436\u0435 \u043F\u043E\u043B\u0435."],["<b>Skulls</b> damage the foe. <b>Fire, Air, Water, Earth</b> gems fill mana for spells. <b>Stars</b> give XP. Earth gems also drop coins.","Las <b>calaveras</b> da\xF1an al enemigo. Las gemas de <b>Fuego, Aire, Agua y Tierra</b> llenan el man\xE1 de los hechizos. Las <b>estrellas</b> dan XP. Las gemas de Tierra tambi\xE9n sueltan monedas.","<b>Caveiras</b> ferem o inimigo. Gemas de <b>Fogo, Ar, \xC1gua e Terra</b> enchem a mana dos feiti\xE7os. <b>Estrelas</b> d\xE3o XP. Gemas de Terra tamb\xE9m soltam moedas.","Les <b>cr\xE2nes</b> blessent l'ennemi. Les gemmes de <b>Feu, d'Air, d'Eau et de Terre</b> remplissent le mana des sorts. Les <b>\xE9toiles</b> donnent de l'XP. Les gemmes de Terre rapportent aussi des pi\xE8ces.","<b>Totenk\xF6pfe</b> verletzen den Gegner. <b>Feuer-, Luft-, Wasser- und Erdsteine</b> f\xFCllen Mana f\xFCr Zauber. <b>Sterne</b> geben EP. Erdsteine bringen auch M\xFCnzen.","<b>\u0427\u0435\u0440\u0435\u043F\
