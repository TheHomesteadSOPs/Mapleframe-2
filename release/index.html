5 \u043F\u043E\u043B\u0435."],["<b>Skulls</b> damage the foe. <b>Fire, Air, Water, Earth</b> gems fill mana for spells. <b>Stars</b> give XP. Earth gems also drop coins.","Las <b>calaveras</b> da\xF1an al enemigo. Las gemas de <b>Fuego, Aire, Agua y Tierra</b> llenan el man\xE1 de los hechizos. Las <b>estrellas</b> dan XP. Las gemas de Tierra tambi\xE9n sueltan monedas.","<b>Caveiras</b> ferem o inimigo. Gemas de <b>Fogo, Ar, \xC1gua e Terra</b> enchem a mana dos feiti\xE7os. <b>Estrelas</b> d\xE3o XP. Gemas de Terra tamb\xE9m soltam moedas.","Les <b>cr\xE2nes</b> blessent l'ennemi. Les gemmes de <b>Feu, d'Air, d'Eau et de Terre</b> remplissent le mana des sorts. Les <b>\xE9toiles</b> donnent de l'XP. Les gemmes de Terre rapportent aussi des pi\xE8ces.","<b>Totenk\xF6pfe</b> verletzen den Gegner. <b>Feuer-, Luft-, Wasser- und Erdsteine</b> f\xFCllen Mana f\xFCr Zauber. <b>Sterne</b> geben EP. Erdsteine bringen auch M\xFCnzen.","<b>\u0427\u0435\u0440\u0435\u043F\u0430</b> \u0440\u0430\u043D\u044F\u0442 \u0432\u0440\u0430\u0433\u0430. \u041A\u0430\u043C\u043D\u0438 <b>\u041E\u0433\u043D\u044F, \u0412\u043E\u0437\u0434\u0443\u0445\u0430, \u0412\u043E\u0434\u044B \u0438 \u0417\u0435\u043C\u043B\u0438</b> \u043D\u0430\u043F\u043E\u043B\u043D\u044F\u044E\u0442 \u043C\u0430\u043D\u0443 \u0434\u043B\u044F \u0437\u0430\u043A\u043B\u0438\u043D\u0430\u043D\u0438\u0439. <b>\u0417\u0432\u0451\u0437\u0434\u044B</b> \u0434\u0430\u044E\u0442 \u043E\u043F\u044B\u0442. \u041A\u0430\u043C\u043D\u0438 \u0417\u0435\u043C\u043B\u0438 \u0442\u0430\u043A\u0436\u0435 \u043F\u0440\u0438\u043D\u043E\u0441\u044F\u0442 \u043C\u043E\u043D\u0435\u0442\u044B."],["Matching <b>4+</b> in a line, or <b>5+ in an L, T or + shape</b>, gives an <b>extra turn</b>; cascades hit harder.","Combinar <b>4+</b> en l\xEDnea, o <b>5+ en forma de L, T o +</b>, da un <b>turno extra</b>; las cascadas pegan m\xE1s fuerte.","Combinar <b>4+</b> em linha, ou <b>5+ em forma de L, T ou +</b>, d\xE1 um <b>turno extra</b>; cascatas causam mais dano.","Aligner <b>4+</b> gemmes, ou <b>5+ en forme de L, T ou +</b>, donne un <b>tour suppl\xE9mentaire</b> ; les cascades frappent plus fort.","<b>4+</b> in einer Reihe oder <b>5+ in L-, T- oder +-Form</b> bringen einen <b>Extrazug</b>; Kaskaden treffen h\xE4rter.","<b>4+</b> \u0432 \u0440\u044F\u0434 \u0438\u043B\u0438 <b>5+ \u0432 \u0444\u043E\u0440\u043C\u0435 L, T \u0438\u043B\u0438 +</b> \u0434\u0430\u044E\u0442 <b>\u0434\u043E\u043F\u043E\u043B\u043D\u0438\u0442\u0435\u043B\u044C\u043D\u044B\u0439 \u0445\u043E\u0434</b>; \u043A\u0430\u0441\u043A\u0430\u0434\u044B \u0431\u044C\u044E\u0442 \u0441\u0438\u043B\u044C\u043D\u0435\u0435."],["Spend coins in the shop after each battle. Watch the enemy's warning for its next special move.","Gasta monedas en la tienda tras cada combate. Atiende el aviso del pr\xF3ximo movimiento especial del enemigo.","Gaste moedas na loja ap\xF3s cada batalha. Fique atento ao aviso do pr\xF3ximo golpe especial do inimigo.","D\xE9pensez vos pi\xE8ces \xE0 la boutique apr\xE8s chaque combat. Surveillez l'avertissement du prochain coup sp\xE9cial de l'ennemi.","Gib nach jedem Kampf M\xFCnzen im Shop aus. Beachte die Warnung vor dem n\xE4chsten Spezialangriff des Gegners.","\u0422\u0440\u0430\u0442\u044C\u0442\u0435 \u043C\u043E\u043D\u0435\u0442\u044B \u0432 \u043C\u0430\u0433\u0430\u0437\u0438\u043D\u0435 \u043F\u043E\u0441\u043B\u0435 \u043A\u0430\u0436\u0434\u043E\u0433\u043E \u0431\u043E\u044F. \u0421\u043B\u0435\u0434\u0438\u0442\u0435 \u0437\u0430 \u043F\u0440\u0435\u0434\u0443\u043F\u0440\u0435\u0436\u0434\u0435\u043D\u0438\u0435\u043C \u043E \u0441\u043B\u0435\u0434\u0443\u044E\u0449\u0435\u043C \u043E\u0441\u043E\u0431\u043E\u043C \u043F\u0440\u0438\u0451\u043C\u0435 \u0432\u0440\u0430\u0433\u0430."],["<b>Keys:</b> arrows move the cursor, Space/Enter grabs a gem, then an arrow swaps it. 1-8 cast spells, H health potion, M mana potion, T hint, Esc menu.","<b>Teclas:</b> las flechas mueven el cursor, Espacio/In
